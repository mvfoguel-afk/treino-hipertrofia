<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Treino"><title>Treino Hipertrofia 2.0</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--blue:#2563eb;--warn:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:72px}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 16px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:800}.sub{font-size:11px;opacity:.65}main{max-width:780px;margin:auto;padding:10px 13px}.tabs{display:flex;gap:6px;overflow:auto;padding:3px 0 9px}.tab{border:0;background:#e5e7eb;border-radius:12px;padding:10px 15px;font-weight:800;min-width:47px}.tab.on{background:var(--ink);color:#fff}.tab.f{position:relative}.tab.f:after{content:"opcional";position:absolute;top:-5px;right:-2px;font-size:7px;background:var(--warn);color:#fff;border-radius:5px;padding:2px 4px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 1px 2px #00000008}.card h2{font-size:17px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--ink);color:#fff;font-weight:750}.btn.secondary{background:#e5e7eb;color:var(--ink)}.btn.green{background:var(--ok)}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--ink)}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#eef2ff;font-size:11px;font-weight:750}.badge.ok{background:#dcfce7;color:#166534}.exercise{padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.exercise h3{margin:0;font-size:16px}.meta{font-size:11px;color:var(--muted);margin:4px 0 10px}.prev{background:#f8fafc;border-radius:11px;padding:9px;margin-bottom:10px;font-size:12px;border:1px solid #eef2f7}.setgrid{display:grid;grid-template-columns:35px 1fr 1fr 50px;gap:6px;align-items:center}.setgrid label{font-size:10px;color:var(--muted);font-weight:700}.setgrid input,select{width:100%;padding:9px;border:1px solid #d9dee7;border-radius:9px;background:#fff}.setnum{text-align:center;font-weight:800}.okset{background:#e5e7eb;color:var(--ink);border:0;border-radius:9px;padding:9px 5px;font-weight:800}.okset.done{background:var(--ok);color:#fff}.tip{border-left:4px solid var(--ink);padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.45}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.link{color:var(--blue);text-decoration:none;font-size:12px;font-weight:750}.navbar{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#fff;border-top:1px solid var(--line);padding:7px}.navinner{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.navbtn{border:0;background:transparent;border-radius:11px;padding:8px 3px;color:#6b7280;font-size:11px;font-weight:750}.navbtn.on{background:#eef2ff;color:var(--ink)}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:100%;max-width:600px;background:#fff;border-radius:24px 24px 0 0;padding:18px;text-align:center}.timerCircle{width:180px;height:180px;border-radius:50%;margin:16px auto;background:conic-gradient(var(--ink) var(--deg),#e5e7eb 0);display:grid;place-items:center;position:relative}.timerCircle:after{content:"";position:absolute;width:148px;height:148px;border-radius:50%;background:#fff}.timerText{position:relative;z-index:2;font-size:31px;font-weight:850}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px}.day{min-height:49px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px}.day.trained{background:var(--ink);color:#fff}.day.today{outline:2px solid var(--blue)}.session{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:50;opacity:0;transition:.2s}.toast.show{opacity:1}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
</style></head><body>
<header><div class="top"><div><div class="title">Treino Hipertrofia</div><div class="sub">Versão 2.0 • ABCDE + F opcional</div></div><button class="btn secondary" onclick="settings()">⚙️</button></div></header><main id="main"></main>
<nav class="navbar"><div class="navinner"><button id="navT" class="navbtn on" onclick="view('train')">🏋️<br>Treino</button><button id="navP" class="navbtn" onclick="view('progress')">📈<br>Evolução</button><button id="navH" class="navbtn" onclick="view('history')">📅<br>Histórico</button></div></nav>
<div id="modal" class="modal"><div class="sheet"><button class="btn secondary" style="float:right" onclick="skip()">Fechar</button><h2>DESCANSO</h2><div id="circle" class="timerCircle" style="--deg:360deg"><div id="timer" class="timerText">02:00</div></div><div id="timerLabel" class="muted"></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn secondary" onclick="extend(30)">+30 s</button><button class="btn secondary" onclick="extend(-30)">−30 s</button><button class="btn" onclick="skip()">Pular</button></div></div></div><div id="toast" class="toast"></div>
<script>
const P={
A:{n:'Peito + Tríceps',e:[['Supino inclinado',3,'6–10','2–3 min','2',['Articulado','Halteres','Barra']],['Supino reto',3,'8–12','2–3 min','1–2',['Articulado','Halteres','Barra']],['Crucifixo na polia',3,'10–15','75–90 s','1',['Polia alta','Polia baixa']],['Chest press',2,'8–12','2 min','1',['Máquina']],['Tríceps na polia',3,'8–12','75–90 s','1',['Barra','Corda']],['Tríceps francês',3,'10–15','75–90 s','1–2',['Halter','Polia']]]},
B:{n:'Costas + Bíceps',e:[['Puxada alta',3,'6–10','2–3 min','2',['Pronada','Neutra']],['Remada baixa',3,'8–12','2 min','1–2',['Neutra','Pronada']],['Remada unilateral apoiada',3,'8–12','90–120 s','1–2',['Halter']],['Puxada alta fechada',2,'10–15','90 s','1',['Neutra','Supinada']],['Face pull',3,'12–20','60–90 s','1–2',['Corda']],['Rosca direta',3,'6–10','90–120 s','1–2',['Barra','Polia']],['Rosca inclinada',2,'10–15','75–90 s','1',['Halter']]]},
C:{n:'Pernas A — Quadríceps',e:[['Leg press',4,'6–10','2–3 min','2',['45°','Horizontal']],['Cadeira extensora',3,'10–15','75–90 s','1',['Máquina']],['Agachamento búlgaro',3,'8–12','90–120 s','2',['Halteres']],['Mesa flexora',3,'8–12','90 s','1–2',['Máquina']],['Cadeira flexora',2,'12–15','75–90 s','1',['Máquina']],['Panturrilha',4,'10–15','60–90 s','1',['Sentado','Leg press']]]},
D:{n:'Ombros + Braços',e:[['Desenvolvimento sentado',3,'6–10','2 min','2',['Halteres','Máquina']],['Elevação lateral',4,'10–20','60–75 s','1',['Halteres','Polia']],['Crucifixo inverso',3,'12–20','60–75 s','1–2',['Halteres','Máquina']],['Rosca Scott / polia',3,'8–12','90 s','1',['Scott','Polia']],['Tríceps francês unilateral',3,'10–15','75–90 s','1',['Polia']],['Rosca martelo',3,'10–15','75–90 s','1',['Halteres','Corda']],['Tríceps corda',3,'10–15','75–90 s','1',['Corda']]]},
E:{n:'Pernas B + Peito/Costas',e:[['Leg press',3,'10–15','2 min','1–2',['45°','Horizontal']],['Cadeira flexora',3,'8–12','90 s','1',['Máquina']],['Hip thrust',3,'8–12','2 min','2',['Máquina','Barra']],['Cadeira extensora',2,'12–15','75 s','1',['Máquina']],['Supino inclinado',3,'8–12','2 min','1–2',['Articulado','Halteres','Barra']],['Remada baixa',3,'8–12','2 min','1–2',['Neutra','Pronada']],['Elevação lateral',2,'15–20','60 s','1',['Halteres','Polia']]]},
F:{n:'Opcional — Sábado',e:[['Supino articulado',3,'8–12','2 min','1–2',['Articulado','Máquina']],['Puxada alta',3,'8–12','2 min','1–2',['Pronada','Neutra']],['Remada apoiada',3,'8–12','2 min','1–2',['Máquina','Halteres']],['Elevação lateral',3,'12–20','60 s','1',['Halteres','Polia']],['Rosca direta',2,'8–12','90 s','1',['Barra','Polia']],['Tríceps corda',2,'10–15','75 s','1',['Corda']],['Panturrilha',3,'10–15','60 s','1',['Sentado','Leg press']]]}
};
const NOTES=['Semana 1 — RIR 2–3. Registre tudo e priorize técnica e amplitude.','Semana 2 — Mantenha a carga e tente aumentar as repetições com RIR 2.','Semana 3 — RIR 1–2 nos principais. Não sacrifique a técnica.','Semana 4 — Se chegar ao topo da faixa em todas as séries, aumente a carga.','Semana 5 — Continue a sobrecarga progressiva e tente superar o último registro.','Semana 6 — Compostos em RIR ~1; isoladores podem chegar a RIR 0–1 na última série.','Semana 7 — Semana forte: busque PRs sem falhar nos exercícios compostos.','Semana 8 — DELOAD: 30–50% menos séries e RIR 3–4. Depois reinicie o bloco.'];
let S=JSON.parse(localStorage.getItem('TH3')||'null');if(!S){S={v:2,day:'A',view:'train',start:null,manualWeek:null,workouts:[],current:null,variants:{}};let old=JSON.parse(localStorage.getItem('TH2')||'null');if(old?.sessions?.length){S.workouts=old.sessions.map(x=>({date:x.date.slice(0,10),day:x.day,week:x.week,seconds:x.seconds,exercises:[]}))}}let timerId=null,end=0,total=90;
const save=()=>localStorage.setItem('TH3',JSON.stringify(S)),today=()=>new Date().toISOString().slice(0,10),fmt=x=>String(Math.floor(Math.max(0,x)/60)).padStart(2,'0')+':'+String(Math.max(0,x)%60).padStart(2,'0'),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function week(){if(S.manualWeek)return S.manualWeek;if(!S.start)return 1;return Math.max(1,Math.min(8,Math.floor((Date.now()-new Date(S.start+'T12:00:00'))/604800000)+1))}function view(x){S.view=x;save();render()}function day(x){S.day=x;S.view='train';save();render()}function cur(){if(!S.current||S.current.day!==S.day||S.current.date!==today())S.current={date:today(),day:S.day,started:null,sets:{}};return S.current}function rest(x){let m=x.match(/(\d+)\s*min/),s=x.match(/(\d+)\s*s/);return(m?+m[1]*60:0)+(s?+s[1]:0)||90}function variant(i){return S.variants[S.day+'-'+i]||P[S.day].e[i][5][0]}function setv(i,v){S.variants[S.day+'-'+i]=v;save();render()}function setset(i,q,f,v){let c=cur(),k=i+'-'+q;c.sets[k]??={};c.sets[k][f]=v;save()}function done(i,q){let c=cur();if(!c.started)c.started=Date.now();let k=i+'-'+q;c.sets[k]??={};c.sets[k].done=true;save();render();startTimer(rest(P[S.day].e[i][3]),P[S.day].e[i][0]+' • próxima série')}function counts(){let c=cur(),n=0,t=0;P[S.day].e.forEach((e,i)=>{for(let q=1;q<=e[1];q++){t++;if(c.sets[i+'-'+q]?.done)n++}});return[n,t]}function previous(d,i){let a=S.workouts.filter(w=>w.day===d&&w.exercises?.[i]);return a.length?a[a.length-1].exercises[i]:null}function best(d,i){let a=[];S.workouts.filter(w=>w.day===d).forEach(w=>(w.exercises?.[i]?.sets?Object.values(w.exercises[i].sets):[]).forEach(s=>{let k=parseFloat(String(s.kg).replace(',','.')),r=parseInt(s.reps);if(!isNaN(k)&&!isNaN(r))a.push({k,r})}));if(!a.length)return'';a.sort((x,y)=>y.k-x.k||y.r-x.r);return a[0].k+' kg × '+a[0].r}
function finish(){let c=cur(),[n]=counts();if(!c.started||!n)return alert('Faça pelo menos uma série antes de finalizar.');let ex=P[S.day].e.map((e,i)=>{let sets={};for(let q=1;q<=e[1];q++){let x=c.sets[i+'-'+q];if(x&&(x.kg||x.reps||x.done))sets[q]={kg:x.kg||'',reps:x.reps||'',done:!!x.done}}return{name:e[0],variant:variant(i),sets}});S.workouts.push({date:c.date,day:S.day,week:week(),seconds:Math.floor((Date.now()-c.started)/1000),exercises:ex});let old=S.day;S.current=null;S.day=old==='F'?'A':String.fromCharCode(old.charCodeAt()+1);save();render();toast('Treino '+old+' concluído • próximo: '+S.day)}
function startTimer(sec,label){clearInterval(timerId);total=sec;end=Date.now()+sec*1000;document.getElementById('modal').classList.add('on');document.getElementById('timerLabel').textContent=label;tick();timerId=setInterval(tick,200)}function tick(){let r=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('circle').style.setProperty('--deg',r/total*360+'deg');document.getElementById('timer').textContent=fmt(r);if(!r){clearInterval(timerId);document.getElementById('timer').textContent='VAMOS!';beep()}}function extend(s){end+=s*1000;if(end<Date.now())end=Date.now()+1}function skip(){clearInterval(timerId);document.getElementById('modal').classList.remove('on')}function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.7)}catch(e){navigator.vibrate?.([300,120,300])}}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function live(){let x=document.getElementById('live');let c=cur();if(x)x.textContent=fmt(c.started?(Date.now()-c.started)/1000:0)}
function render(){document.getElementById('navT').classList.toggle('on',S.view==='train');document.getElementById('navP').classList.toggle('on',S.view==='progress');document.getElementById('navH').classList.toggle('on',S.view==='history');if(S.view==='train')train();else if(S.view==='progress')progress();else history()}
function train(){let d=S.day,p=P[d],c=cur(),[n,t]=counts(),w=week();let h='<div class="tabs">'+Object.keys(P).map(x=>`<button class="tab ${x===d?'on':''} ${x==='F'?'f':''}" onclick="day('${x}')">${x}</button>`).join('')+'</div><div class="card"><div class="row between"><div><h2>Treino '+d+' — '+esc(p.n)+'</h2><div class="muted">Semana '+w+' de 8</div></div><span class="badge">'+n+'/'+t+' séries</span></div><p class="tip">'+NOTES[w-1]+'</p><div class="row between"><b>Tempo: <span id="live">00:00</span></b><span class="muted">'+S.workouts.length+' treinos concluídos</span></div><div class="progress"><span style="width:'+(t?n/t*100:0)+'%"></span></div></div>`;p.e.forEach((e,i)=>{let [name,sets,reps,rs,rir,vs]=e,pr=previous(d,i),pv=pr?Object.values(pr.sets||{}).filter(x=>x.kg||x.reps).map(x=>(x.kg||'—')+' kg × '+(x.reps||'—')).join(' / '):'Sem registro anterior',cset=c.sets||{};h+=`<div class="card exercise"><div class="head"><div><h3>${i+1}. ${esc(name)}</h3><div class="meta">${sets} × ${reps} • descanso ${rs} • RIR ${rir}</div></div><a class="link" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' execução correta '+variant(i))}">▶ Vídeo</a></div><div class="prev"><b>Último treino:</b> ${esc(pv)}${best(d,i)?'<br><span class="muted">Melhor registro: '+esc(best(d,i))+'</span>':''}</div><select onchange="setv(${i},this.value)">${vs.map(v=>`<option ${v===variant(i)?'selected':''}>${esc(v)}</option>`).join('')}</select><div class="setgrid"><label>SÉRIE</label><label>KG</label><label>REPS</label><label>OK</label>`;for(let q=1;q<=sets;q++){let x=cset[i+'-'+q]||{},r=pr?.sets?.[q];h+=`<div class="setnum">${q}</div><input inputmode="decimal" value="${esc(x.kg)}" placeholder="${esc(r?.kg||'kg')}" onchange="setset(${i},${q},'kg',this.value)"><input inputmode="numeric" value="${esc(x.reps)}" placeholder="${esc(r?.reps||'reps')}" onchange="setset(${i},${q},'reps',this.value)"><button class="okset ${x.done?'done':''}" onclick="done(${i},${q})">${x.done?'✓':'OK'}</button>`}h+='</div></div>'});h+='<div class="card"><button class="btn green" style="width:100%" onclick="finish()">✓ FINALIZAR TREINO '+d+'</button><p class="muted">Ao finalizar, o treino é salvo no histórico e o próximo A→B→C… é selecionado automaticamente.</p></div>';document.getElementById('main').innerHTML=h;live()}
function progress(){let w=week(),secs=S.workouts.reduce((a,x)=>a+x.seconds,0);let h=`<div class="card"><h2>📈 Evolução</h2><div class="statgrid"><div class="stat"><b>${S.workouts.length}</b><span>treinos</span></div><div class="stat"><b>${fmt(secs)}</b><span>tempo total</span></div><div class="stat"><b>${w}/8</b><span>semana</span></div></div><p class="tip" style="margin-top:10px">${NOTES[w-1]}</p></div><div class="card"><h2>Bloco de 8 semanas</h2><div class="row">${[1,2,3,4,5,6,7,8].map(x=>`<span class="badge ${x===w?'ok':''}">S${x}</span>`).join('')}</div><p class="muted">A semana é calculada pela data de início configurada em ⚙️.</p></div><div class="card"><h2>Últimos treinos</h2>${S.workouts.slice().reverse().slice(0,12).map(x=>`<div class="session"><span><b>${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}</b> — Treino ${x.day}<br><span class="muted">Semana ${x.week} • ${fmt(x.seconds)}</span></span><b>${x.exercises.reduce((a,e)=>a+Object.keys(e.sets||{}).length,0)} séries</b></div>`).join('')||'<p class="muted">Ainda não há treinos concluídos.</p>'}</div>`;document.getElementById('main').innerHTML=h}
let cm=new Date();function history(){let y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),map={};S.workouts.forEach(x=>(map[x.date]??=[]).push(x.day));let h=`<div class="card"><div class="row between"><button class="btn secondary" onclick="cm.setMonth(cm.getMonth()-1);history()">‹</button><h2>${new Date(y,m,1).toLocaleString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn secondary" onclick="cm.setMonth(cm.getMonth()+1);history()">›</button></div><div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="dow">${x}</div>`).join('')}`;for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let k=new Date(y,m,d).toISOString().slice(0,10),a=map[k]||[];h+=`<div class="day ${a.length?'trained':''} ${k===today()?'today':''}" ${a.length?`onclick="showDate('${k}')"`:''}><b>${d}</b>${a.length?`<div>${a.join(' · ')}</div>`:''}</div>`}h+='</div></div><div class="card"><h2>Histórico recente</h2>'+S.workouts.slice().reverse().slice(0,20).map(x=>`<div class="session"><span><b>${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR')}</b> — Treino ${x.day}<br><span class="muted">Semana ${x.week} • ${fmt(x.seconds)}</span></span><button class="btn secondary" onclick="showDate('${x.date}')">Ver</button></div>`).join('')+'</div>';document.getElementById('main').innerHTML=h}
function showDate(date){let a=S.workouts.filter(x=>x.date===date),h=`<div class="card"><button class="btn secondary" onclick="history()">← Voltar</button><h2 style="margin-top:12px">${new Date(date+'T12:00:00').toLocaleDateString('pt-BR')}</h2>`;a.forEach(w=>{h+=`<p><b>Treino ${w.day} — ${esc(P[w.day].n)}</b><br><span class="muted">Semana ${w.week} • ${fmt(w.seconds)}</span></p><table><tr><th>Exercício</th><th>Variação</th><th>Desempenho</th></tr>`;w.exercises.forEach(e=>h+=`<tr><td>${esc(e.name)}</td><td>${esc(e.variant)}</td><td>${Object.values(e.sets||{}).filter(s=>s.kg||s.reps).map(s=>(s.kg||'—')+' kg × '+(s.reps||'—')).join(' / ')||'—'}</td></tr>`);h+='</table>'});document.getElementById('main').innerHTML=h+'</div>'}
function settings(){document.getElementById('main').innerHTML=`<div class="card"><button class="btn secondary" onclick="view('train')">← Voltar</button><h2 style="margin-top:12px">⚙️ Configurações</h2><label class="muted">Início do bloco de 8 semanas</label><input id="start" type="date" value="${S.start||''}" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;margin:5px 0 12px"><label class="muted">Semana manual (opcional)</label><select id="manual" style="margin:5px 0 12px"><option value="">Automática</option>${[1,2,3,4,5,6,7,8].map(x=>`<option value="${x}" ${S.manualWeek==x?'selected':''}>Semana ${x}</option>`).join('')}</select><button class="btn" onclick="saveSettings()">Salvar</button></div><div class="card"><h2>💾 Backup</h2><p class="muted">Exporte seus dados para não depender do navegador. O backup inclui histórico, cargas, repetições e variações.</p><button class="btn" onclick="backup()">Exportar backup</button> <label class="btn secondary">Importar backup<input type="file" accept="application/json,.json" onchange="restore(this)" style="display:none"></label></div>`}
function saveSettings(){S.start=document.getElementById('start').value||null;S.manualWeek=document.getElementById('manual').value?+document.getElementById('manual').value:null;save();toast('Configurações salvas');setTimeout(()=>view('train'),300)}function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='treino-hipertrofia-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.v||!x.workouts)throw 0;S=x;save();toast('Backup importado');setTimeout(()=>view('train'),400)}catch(e){alert('Backup inválido.')}};r.readAsText(f)}setInterval(live,1000);render();
</script></body></html>
