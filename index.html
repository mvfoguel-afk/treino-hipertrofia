<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino Hipertrofia</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;margin:0}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}main{max-width:760px;margin:auto;padding:12px 14px 80px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button,.b{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.tabs button{background:#ddd}.tabs .on,.b{background:#111827;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:14px;margin:9px 0}.muted{color:#6b7280;font-size:12px}.rows{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:6px;align-items:center}.rows input,select{padding:9px;border:1px solid #ddd;border-radius:8px;width:100%}.ok{background:#16a34a!important;color:#fff}.progress{height:8px;background:#ddd;border-radius:8px}.progress span{display:block;height:100%;background:#111827}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}.box{background:#fff;border-radius:20px;padding:22px;width:85%;max-width:380px;text-align:center}.circle{width:120px;height:120px;border-radius:50%;margin:15px auto;background:conic-gradient(#111827 var(--deg),#ddd 0);display:grid;place-items:center}.circle:after{content:"";grid-area:1/1;width:96px;height:96px;border-radius:50%;background:#fff}.ct{grid-area:1/1;z-index:2;font-weight:800;font-size:22px}.link{color:#2563eb;font-size:12px;text-decoration:none;font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:38px;border:1px solid #ddd;border-radius:7px;padding:3px;font-size:11px}.done{background:#111827;color:#fff}.row2{display:flex;gap:8px;flex-wrap:wrap}
</style></head>
<body>
<header><b style="font-size:22px">Treino Hipertrofia</b><div style="opacity:.7;font-size:12px">ABCDE + F opcional</div></header>
<main><div id="tabs" class="tabs"></div><div id="app"></div></main>
<div id="modal" class="modal"><div class="box"><button onclick="closeT()">×</button><div id="clock" class="circle" style="--deg:360deg"><div id="ct" class="ct">02:00</div></div><div id="tn" class="muted"></div><button class="b" onclick="add(30)">+30 s</button> <button class="b" onclick="closeT()">Pular</button></div></div>
<script>
const W={
A:["Peito + Tríceps",[["Supino inclinado",3,"6–10","2–3 min","2",["Articulado","Halteres","Barra"]],["Supino reto",3,"8–12","2–3 min","1–2",["Articulado","Halteres","Barra"]],["Crucifixo na polia",3,"10–15","75–90 s","1",["Polia alta","Polia baixa"]],["Chest press",2,"8–12","2 min","1",["Máquina"]],["Tríceps na polia",3,"8–12","75–90 s","1",["Barra","Corda"]],["Tríceps francês",3,"10–15","75–90 s","1–2",["Halter","Polia"]]]],
B:["Costas + Bíceps",[["Puxada alta",3,"6–10","2–3 min","2",["Pronada","Neutra"]],["Remada baixa",3,"8–12","2 min","1–2",["Neutra","Pronada"]],["Remada unilateral apoiada",3,"8–12","90–120 s","1–2",["Halter"]],["Puxada alta fechada",2,"10–15","90 s","1",["Neutra","Supinada"]],["Face pull",3,"12–20","60–90 s","1–2",["Corda"]],["Rosca direta",3,"6–10","90–120 s","1–2",["Barra","Polia"]],["Rosca inclinada",2,"10–15","75–90 s","1",["Halter"]]]],
C:["Pernas A — Quadríceps",[["Leg press",4,"6–10","2–3 min","2",["45°","Horizontal"]],["Cadeira extensora",3,"10–15","75–90 s","1",["Máquina"]],["Agachamento búlgaro",3,"8–12","90–120 s","2",["Halteres"]],["Mesa flexora",3,"8–12","90 s","1–2",["Máquina"]],["Cadeira flexora",2,"12–15","75–90 s","1",["Máquina"]],["Panturrilha",4,"10–15","60–90 s","1",["Sentado","Leg press"]]]],
D:["Ombros + Braços",[["Desenvolvimento sentado",3,"6–10","2 min","2",["Halteres","Máquina"]],["Elevação lateral",4,"10–20","60–75 s","1",["Halteres","Polia"]],["Crucifixo inverso",3,"12–20","60–75 s","1–2",["Halteres","Máquina"]],["Rosca Scott / polia",3,"8–12","90 s","1",["Scott","Polia"]],["Tríceps francês unilateral",3,"10–15","75–90 s","1",["Polia"]],["Rosca martelo",3,"10–15","75–90 s","1",["Halteres","Corda"]],["Tríceps corda",3,"10–15","75–90 s","1",["Corda"]]]],
E:["Pernas B + Peito/Costas",[["Leg press",3,"10–15","2 min","1–2",["45°","Horizontal"]],["Cadeira flexora",3,"8–12","90 s","1",["Máquina"]],["Hip thrust",3,"8–12","2 min","2",["Máquina","Barra"]],["Cadeira extensora",2,"12–15","75 s","1",["Máquina"]],["Supino inclinado",3,"8–12","2 min","1–2",["Articulado","Halteres","Barra"]],["Remada baixa",3,"8–12","2 min","1–2",["Neutra","Pronada"]],["Elevação lateral",2,"15–20","60 s","1",["Halteres","Polia"]]]],
F:["Opcional — Sábado",[["Supino articulado",3,"8–12","2 min","1–2",["Articulado","Máquina"]],["Puxada alta",3,"8–12","2 min","1–2",["Pronada","Neutra"]],["Remada apoiada",3,"8–12","2 min","1–2",["Máquina","Halteres"]],["Elevação lateral",3,"12–20","60 s","1",["Halteres","Polia"]],["Rosca direta",2,"8–12","90 s","1",["Barra","Polia"]],["Tríceps corda",2,"10–15","75 s","1",["Corda"]],["Panturrilha",3,"10–15","60 s","1",["Sentado","Leg press"]]]]
};
const notes=["Semana 1: RIR 2–3; registre cargas e aprenda as faixas.","Semana 2: aumente repetições mantendo RIR 2–3.","Semana 3: RIR 1–2 e busque o topo das faixas.","Semana 4: topo da faixa em todas as séries? Aumente a carga.","Semana 5: RIR 1–2 e continue a progressão.","Semana 6: compostos ~RIR 1; isoladores podem chegar a RIR 0–1 na última série.","Semana 7: tente superar registros sem falhar nos exercícios grandes.","Semana 8: DELOAD — 30–50% menos séries, RIR 3–4."];
let s=JSON.parse(localStorage.getItem("TH2")||'{"week":1,"day":"A","data":{},"sessions":[],"start":null}'),timer,end,total;
const save=()=>localStorage.setItem("TH2",JSON.stringify(s)),K=(d,i,n)=>d+"-"+i+"-"+n,V=(k,f)=>s.data[k]?.[f]||"";
function setDay(d){s.day=d;save();render()}function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}function rest(x){let a=x.match(/(\d+)\s*min/),b=x.match(/(\d+)\s*s/);return(a?+a[1]*60:0)+(b?+b[1]:0)||90}
function timerStart(sec,name){clearInterval(timer);total=sec;end=Date.now()+sec*1000;modal.classList.add("on");tn.textContent=name||"";tick();timer=setInterval(tick,200)}
function tick(){let r=Math.max(0,Math.ceil((end-Date.now())/1000));clock.style.setProperty("--deg",r/total*360+"deg");ct.textContent=fmt(r);if(!r){clearInterval(timer);ct.textContent="VAMOS!";beep()}}
function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.6)}catch(e){navigator.vibrate?.([300,150,300])}}
function add(x){end+=x*1000}function closeT(){clearInterval(timer);modal.classList.remove("on")}
function render(){
let d=s.day,w=W[d],done=w[1].filter((_,i)=>V(K(d,i,1),"done")).length;
tabs.innerHTML=Object.keys(W).map(x=>`<button class="${x==d?"on":""}" onclick="setDay('${x}')">${x}${x=="F"?"*":""}</button>`).join("");
let elapsed=s.start?Math.floor((Date.now()-s.start)/1000):0;
let h=`<div class=card><b>Semana ${s.week}</b><p class=muted>${notes[s.week-1]}</p><b>Tempo total: <span id=elapsed>${fmt(elapsed)}</span></b><p class=muted>${done}/${w[1].length} exercícios • ${s.sessions.length} treinos concluídos</p><div class=progress><span style="width:${done/w[1].length*100}%"></span></div><div class=row2 style="margin-top:10px"><button class=b onclick="calendar()">📅 Histórico</button><button class=b onclick="showProgress()">📈 Progressão</button></div></div>`;
w[1].forEach((e,i)=>{let[n,sets,reps,rs,rir,vs]=e;h+=`<div class=card><b>${i+1}. ${n}</b><div class=muted>${sets}× ${reps} • descanso ${rs} • RIR ${rir}</div><p>Variação: <select onchange="setv('${K(d,i,0)}','variant',this.value)">${vs.map(v=>`<option ${v==V(K(d,i,0),"variant")?"selected":""}>${v}</option>`).join("")}</select></p><a class=link target=_blank href="https://www.youtube.com/results?search_query=${encodeURIComponent(n+" execução "+(V(K(d,i,0),"variant")||vs[0]))}">▶ Ver execução no YouTube</a><div class=rows style="margin-top:8px"><small>Série</small><small>kg</small><small>reps</small><small>OK</small>`;for(let q=1;q<=sets;q++){let k=K(d,i,q);h+=`<span>${q}</span><input value="${V(k,"kg")}" onchange="setv('${k}','kg',this.value)" placeholder="kg"><input value="${V(k,"reps")}" onchange="setv('${k}','reps',this.value)" placeholder="reps"><button class="${V(k,"done")?"ok":""}" onclick="done('${k}',${rest(rs)},'${n}')">${V(k,"done")?"✓":"OK"}</button>`}h+=`</div></div>`});
h+=`<div class=card><button class=b style="width:100%" onclick=finish()>✓ Finalizar treino ${d}</button><p class=muted>Salva o treino e abre o próximo A→E. F é opcional.</p></div>`;app.innerHTML=h}
function setv(k,f,v){s.data[k]??={};s.data[k][f]=v;save()}function done(k,r,n){if(!s.start)s.start=Date.now();setv(k,"done",true);render();timerStart(r,n)}
function finish(){if(!s.start)return alert("Faça pelo menos uma série antes de finalizar.");let d=s.day;s.sessions.push({date:new Date().toISOString(),day:d,week:s.week,seconds:Math.floor((Date.now()-s.start)/1000)});s.start=null;if(d!="F")s.day=String.fromCharCode(d.charCodeAt()+1);else s.day="A";save();render();alert("Treino "+d+" concluído! Próximo: "+s.day)}
function calendar(){let m={},t=new Date();s.sessions.forEach(x=>m[x.date.slice(0,10)]=(m[x.date.slice(0,10)]||[]).concat(x.day));let y=t.getFullYear(),mo=t.getMonth(),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),h=`<div class=card><b>Histórico — ${t.toLocaleString("pt-BR",{month:"long",year:"numeric"})}</b><div class=calendar style="margin-top:10px">`;for(let i=0;i<f;i++)h+="<div></div>";for(let d=1;d<=n;d++){let z=new Date(y,mo,d).toISOString().slice(0,10);h+=`<div class="day ${m[z]?"done":""}">${d}${m[z]?`<br>${m[z].join(" · ")}`:""}</div>`}h+="</div><hr>"+s.sessions.slice().reverse().map(x=>`<p><b>${new Date(x.date).toLocaleDateString("pt-BR")}</b> — ${x.day} • semana ${x.week} • ${fmt(x.seconds)}</p>`).join("")+"</div>";app.innerHTML=h}
function showProgress(){app.innerHTML=`<div class=card><b>Progressão</b><p class=muted>O app guarda carga, repetições e variação de cada série no aparelho.</p><p>Semana atual: <b>${s.week}</b></p><button class=b onclick="s.week=Math.min(8,s.week+1);save();render()">Avançar semana</button> <button class=b onclick="s.week=Math.max(1,s.week-1);save();render()">Voltar</button></div>`}
setInterval(()=>{if(s.start&&document.getElementById("elapsed"))elapsed.textContent=fmt(Math.floor((Date.now()-s.start)/1000))},1000);render();
</script>
</body></html>
