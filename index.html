<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--blue:#2563eb;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:76px}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 16px;box-shadow:0 2px 10px #0002}
.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:850}.sub{font-size:11px;opacity:.7}
main{max-width:780px;margin:auto;padding:10px 13px 25px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 9px}.tab{border:0;background:#e5e7eb;color:#374151;border-radius:12px;padding:10px 14px;font-weight:800;min-width:46px}.tab.on{background:var(--ink);color:#fff}.tab.optional{position:relative}.tab.optional:after{content:"opcional";position:absolute;font-size:7px;top:-5px;right:-2px;background:var(--warn);color:#fff;border-radius:5px;padding:2px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 1px 2px #00000008}.card h2{font-size:17px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--ink);color:#fff;font-weight:750}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:var(--ok)}.btn.blue{background:var(--blue)}.btn:disabled{opacity:.45}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--ink)}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#eef2ff;font-size:11px;font-weight:750}.badge.ok{background:#dcfce7;color:#166534}.tip{border-left:4px solid var(--ink);padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.45}
.exercise h3{margin:0;font-size:16px}.meta{font-size:11px;color:var(--muted);margin:4px 0 10px}.prev{background:#f8fafc;border-radius:11px;padding:9px;margin:10px 0;font-size:12px;border:1px solid #eef2f7}
.setgrid{display:grid;grid-template-columns:35px 1fr 1fr 50px;gap:6px;align-items:center}.setgrid.home{grid-template-columns:35px 1fr 50px}.setgrid label{font-size:10px;color:var(--muted);font-weight:700}.setgrid input{width:100%;padding:9px;border:1px solid #d9dee7;border-radius:9px;background:#fff;min-width:0}.setnum{font-weight:800;text-align:center}.okset{background:#e5e7eb;border:0;border-radius:9px;padding:9px 5px;font-weight:800}.okset.done{background:var(--ok);color:#fff}
select{padding:9px;border:1px solid #d9dee7;border-radius:9px;background:#fff;width:100%}.link{color:var(--blue);text-decoration:none;font-size:12px;font-weight:750}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#fff;border-top:1px solid var(--line);padding:7px}.navinner{width:100%;max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.navbtn{border:0;background:transparent;border-radius:11px;padding:7px 3px;color:#6b7280;font-size:11px;font-weight:750}.navbtn.on{background:#eef2ff;color:#111827}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center}.modal.on{display:flex}.sheet{width:92%;max-width:420px;background:#fff;border-radius:24px;padding:20px;text-align:center}.circle{width:180px;height:180px;border-radius:50%;margin:15px auto;background:conic-gradient(var(--ink) var(--deg),#e5e7eb 0);display:grid;place-items:center;position:relative}.circle:after{content:"";position:absolute;width:148px;height:148px;border-radius:50%;background:#fff}.timertext{position:relative;z-index:2;font-size:31px;font-weight:850}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px}.calday{min-height:48px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px}.calday.trained{background:var(--ink);color:#fff}.calday.today{outline:2px solid var(--blue)}.session{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:50;opacity:0;transition:.2s}.toast.show{opacity:1}
.phasebar{display:flex;gap:7px}.phasebar button{flex:1}.small{font-size:11px}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.schedule div{background:#f8fafc;border-radius:10px;padding:9px;font-size:12px}
@media(max-width:420px){.setgrid{grid-template-columns:28px 1fr 1fr 46px}.setgrid.home{grid-template-columns:28px 1fr 46px}.statgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div><div class="title">Treino Hipertrofia</div><div class="sub">Versão 3.0 • novo ciclo + fase França</div></div><button class="btn secondary" onclick="settings()">⚙️</button></div></header>
<main id="main"></main>
<nav class="navbar"><div class="navinner">
<button id="navTrain" class="navbtn on" onclick="go('train')">🏋️<br>Treino</button>
<button id="navProgress" class="navbtn" onclick="go('progress')">📈<br>Evolução</button>
<button id="navHistory" class="navbtn" onclick="go('history')">📅<br>Histórico</button>
<button id="navPlan" class="navbtn" onclick="go('plan')">🗓️<br>Plano</button>
</div></nav>
<div id="timerModal" class="modal"><div class="sheet"><button class="btn secondary" onclick="skipTimer()">Fechar</button><h2>DESCANSO</h2><div id="circle" class="circle" style="--deg:360deg"><div id="timerText" class="timertext">02:00</div></div><div id="timerLabel" class="muted"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn secondary" onclick="extendTimer(30)">+30 s</button><button class="btn secondary" onclick="extendTimer(-30)">−30 s</button><button class="btn" onclick="skipTimer()">Pular</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const GYM={
 A:{n:"Peitoral + dorsais",e:[
  ["Supino inclinado articulado",3,"6–10","2–3 min","2",["Articulado","Halteres"]],
  ["Puxada alta pronada",3,"8–12","2 min","2",["Pronada","Neutra"]],
  ["Supino reto articulado",3,"8–12","2 min","1–2",["Articulado","Halteres"]],
  ["Remada apoiada",3,"8–12","2 min","1–2",["Máquina","Halteres"]],
  ["Crucifixo máquina (peck deck)",3,"10–15","75–90 s","1–2",["Peck deck"]],
  ["Tríceps na polia",2,"10–15","75–90 s","1–2",["Barra","Corda"]]
 ]},
 B:{n:"Pernas — quadríceps",e:[
  ["Leg press 45°",4,"8–12","2–3 min","2",["45°"]],
  ["Cadeira extensora",3,"10–15","75–90 s","1–2",["Máquina"]],
  ["Mesa flexora",2,"10–15","90 s","2",["Máquina"]],
  ["Panturrilha sentado",4,"10–15","60–90 s","1–2",["Sentado","Leg press"]],
  ["Dead bug",2,"8–12 por lado","60 s","2–3",["Solo"]]
 ]},
 C:{n:"Costas + ombros + braços",e:[
  ["Remada apoiada",3,"8–12","2 min","1–2",["Máquina","Halteres"]],
  ["Puxada alta neutra",3,"8–12","2 min","1–2",["Neutra","Pronada"]],
  ["Desenvolvimento sentado",2,"8–12","2 min","2",["Máquina","Halteres"]],
  ["Elevação lateral",4,"12–20","60–75 s","1–2",["Halteres","Polia"]],
  ["Crucifixo inverso",3,"12–20","60–75 s","1–2",["Máquina","Halteres"]],
  ["Rosca Scott",3,"8–12","90 s","1–2",["Scott","Polia"]],
  ["Tríceps francês na polia",3,"10–15","75–90 s","1–2",["Polia"]]
 ]},
 D:{n:"Pernas — posteriores + glúteos",e:[
  ["Leg press horizontal",3,"10–15","2 min","1–2",["Horizontal"]],
  ["Hip thrust",3,"8–12","2 min","2",["Máquina"]],
  ["Flexora em pé unilateral",3,"10–15 por perna","75–90 s","1–2",["Em pé"]],
  ["Mesa flexora",2,"10–15","90 s","1–2",["Máquina"]],
  ["Cadeira extensora",2,"12–15","75 s","1–2",["Máquina"]],
  ["Panturrilha",3,"10–15","60–90 s","1–2",["Sentado","Leg press"]],
  ["Prancha lateral",2,"20–40 s por lado","60 s","2–3",["Solo"]]
 ]},
 E:{n:"Especialização de superiores (opcional)",optional:true,e:[
  ["Pullover na polia",3,"10–15","90 s","1–2",["Polia"]],
  ["Elevação lateral",3,"12–20","60 s","1–2",["Halteres","Polia"]],
  ["Face pull",2,"12–20","60–75 s","1–2",["Corda"]],
  ["Rosca martelo",2,"10–15","75–90 s","1–2",["Halteres","Corda"]],
  ["Tríceps corda",2,"10–15","75–90 s","1–2",["Corda"]],
  ["Crucifixo máquina (peck deck)",2,"12–15","75 s","1–2",["Peck deck"]]
 ]}
};
const HOME={
 H1:{n:"Casa 1 — corpo inteiro",e:[
  ["Flexão de braços (inclinada se necessário)",3,"8–15","90 s","1–2",[]],
  ["Agachamento até uma cadeira",3,"12–20","90 s","2–3",[]],
  ["Ponte de glúteos",3,"12–20","75 s","1–2",[]],
  ["Remada isométrica com auto-resistência",3,"20–30 s","60 s","2",[]],
  ["Dead bug",2,"8–12 por lado","60 s","2–3",[]],
  ["Prancha lateral",2,"20–40 s por lado","60 s","2–3",[]]
 ]},
 H2:{n:"Casa 2 — corpo inteiro",e:[
  ["Flexão com mãos próximas (adaptada)",3,"6–12","90 s","1–2",[]],
  ["Agachamento com pausa",3,"10–15","90 s","2",[]],
  ["Ponte de glúteos unilateral (se confortável)",3,"8–12 por lado","75 s","2",[]],
  ["Puxada isométrica com auto-resistência",3,"20–30 s","60 s","2",[]],
  ["Rosca isométrica com auto-resistência",2,"20–30 s","60 s","2",[]],
  ["Bird dog",2,"8–10 por lado","60 s","2–3",[]]
 ]},
 H3:{n:"Casa 3 — corpo inteiro",e:[
  ["Flexão de braços com descida lenta",3,"6–12","90 s","1–2",[]],
  ["Sentar e levantar da cadeira (tempo 3 s)",3,"12–18","90 s","2",[]],
  ["Ponte de glúteos com pausa",3,"12–20","75 s","1–2",[]],
  ["Remada isométrica com auto-resistência",3,"20–30 s","60 s","2",[]],
  ["Tríceps isométrico com auto-resistência",2,"20–30 s","60 s","2",[]],
  ["Dead bug",2,"8–12 por lado","60 s","2–3",[]]
 ]}
};
const NOTES=[
"Semana 1 — READAPTAÇÃO após a pausa: faça cerca de 60–70% das séries previstas, RIR 3–4 e cargas conservadoras.",
"Semana 2 — Retome o volume previsto. RIR 2–3 e priorize técnica e amplitude confortável.",
"Semana 3 — Progressão: tente aumentar repetições mantendo RIR 2.",
"Semana 4 — Intensificação controlada: RIR 1–2 nos exercícios principais, sem falha nos compostos.",
"Semana 5 — RECUPERAÇÃO: reduza o volume em 30–40%, mantenha movimento e técnica.",
"Semana 6 — Retome a progressão: aumente repetições antes de aumentar a carga.",
"Semana 7 — Sobrecarga: RIR 1–2; última série de isoladores pode chegar a RIR 0–1 se a execução permanecer boa.",
"Semana 8 — Semana forte: busque recordes de repetições/carga com segurança; não force falha em exercícios compostos.",
"Semana 9 — Transição: reduza um pouco o volume e chegue à viagem recuperado."
];
const KEY="TREINO_HIPERTROFIA_21";
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S)S={version:3,day:"A",mode:"gym",view:"train",programStart:"2026-11-16",weekOverride:null,workouts:[],current:null,variants:{}};
if(!Array.isArray(S.workouts))S.workouts=[];
if(!S.variants)S.variants={};
if(!S.mode)S.mode="gym";
if((S.version||0)<3){S.mode="gym";S.day="A";S.current=null;S.view="train"}
if(!S.day||(!GYM[S.day]&&!HOME[S.day]))S.day="A";
if(!S.programStart||S.programStart<"2026-11-16"){S.programStart="2026-11-16";S.weekOverride=null}
S.version=3;
let timerId=null,end=0,total=90,cal=new Date();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]})}
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function week(){if(S.weekOverride)return S.weekOverride;let start=new Date((S.programStart||"2026-11-16")+"T12:00:00");let d=Math.floor((Date.now()-start.getTime())/86400000);return Math.max(1,Math.min(9,Math.floor(d/7)+1))}
function restSec(x){let a=x.match(/(\d+)\s*min/),b=x.match(/(\d+)\s*s/);return(a?+a[1]*60:0)+(b?+b[1]:0)||90}
function plan(){return S.mode==="home"?HOME:GYM}
function go(v){S.view=v;save();render()}
function setMode(m){S.mode=m;S.day=m==="home"?"H1":"A";S.current=null;S.view="train";save();render()}
function day(d){S.day=d;S.view="train";S.current=null;save();render()}
function current(){if(!S.current||S.current.day!==S.day||S.current.date!==today()){S.current={date:today(),day:S.day,mode:S.mode,started:null,sets:{}};save()}return S.current}
function variant(i){let p=plan();return S.variants[S.mode+"-"+S.day+"-"+i]||(p[S.day].e[i][5][0]||"Peso corporal")}
function setVariant(i,v){S.variants[S.mode+"-"+S.day+"-"+i]=v;save();render()}
function setSet(i,q,f,v){let c=current(),k=i+"-"+q;c.sets[k]||(c.sets[k]={});c.sets[k][f]=v;save()}
function targetSets(e){return S.mode==="gym"&&week()===1?Math.max(1,Math.round(e[1]*0.65)):e[1]}
function counts(){let c=current(),n=0,t=0;plan()[S.day].e.forEach(function(e,i){for(let q=1;q<=targetSets(e);q++){t++;if(c.sets[i+"-"+q]&&c.sets[i+"-"+q].done)n++}});return[n,t]}
function previous(dayKey,exerciseName){let a=S.workouts.filter(function(w){return w.day===dayKey&&w.exercises});for(let j=a.length-1;j>=0;j--){let ex=a[j].exercises.find(function(e){return e.name===exerciseName});if(ex)return ex}return null}
function best(dayKey,exerciseName){let v=[];S.workouts.filter(function(w){return w.day===dayKey&&w.exercises}).forEach(function(w){let ex=w.exercises.find(function(e){return e.name===exerciseName});if(ex)Object.values(ex.sets||{}).forEach(function(s){let kg=parseFloat(String(s.kg||"").replace(",",".")),rp=parseInt(s.reps);if(!isNaN(kg)&&!isNaN(rp))v.push({kg:kg,rp:rp})})});if(!v.length)return"";v.sort(function(a,b){return b.kg-a.kg||b.rp-a.rp});return v[0].kg+" kg × "+v[0].rp}
function done(i,q){let c=current();if(!c.started)c.started=Date.now();let k=i+"-"+q;c.sets[k]||(c.sets[k]={});c.sets[k].done=true;save();render();timerStart(restSec(plan()[S.day].e[i][3]),plan()[S.day].e[i][0]+" • próxima série")}
function finish(){
 let c=current(),ct=counts(),p=plan();
 if(!c.started||ct[0]===0){alert("Marque pelo menos uma série antes de finalizar.");return}
 let ex=p[S.day].e.map(function(e,i){let sets={};for(let q=1;q<=targetSets(e);q++){let x=c.sets[i+"-"+q];if(x&&(x.kg||x.reps||x.done))sets[q]={kg:x.kg||"",reps:x.reps||"",done:!!x.done}}return{name:e[0],variant:variant(i),sets:sets}});
 S.workouts.push({date:c.date,day:S.day,mode:S.mode,week:week(),seconds:Math.floor((Date.now()-(c.started||Date.now()))/1000),exercises:ex});
 let old=S.day;S.current=null;
 if(S.mode==="home"){S.day=old==="H1"?"H2":old==="H2"?"H3":"H1"}
 else if(old==="E"){S.day="A"}else{S.day=old==="A"?"B":old==="B"?"C":old==="C"?"D":"A"}
 save();render();toast("Treino "+old+" concluído! Próximo: "+S.day)
}
function timerStart(sec,label){clearInterval(timerId);total=sec;end=Date.now()+sec*1000;document.getElementById("timerModal").classList.add("on");document.getElementById("timerLabel").textContent=label;tick();timerId=setInterval(tick,200)}
function tick(){let r=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("circle").style.setProperty("--deg",(r/total*360)+"deg");document.getElementById("timerText").textContent=fmt(r);if(!r){clearInterval(timerId);document.getElementById("timerText").textContent="VAMOS!";beep()}}
function extendTimer(s){end+=s*1000;if(end<Date.now())end=Date.now()+1}
function skipTimer(){clearInterval(timerId);document.getElementById("timerModal").classList.remove("on")}
function beep(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.7)}catch(e){if(navigator.vibrate)navigator.vibrate([300,120,300])}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function train(){
 let p=plan(),d=S.day,ex=p[d],c=current(),ct=counts(),w=week(),h="";
 h+='<div class="phasebar"><button class="btn '+(S.mode==="gym"?"":"secondary")+'" onclick="setMode(\'gym\')">🏋️ Academia</button><button class="btn '+(S.mode==="home"?"":"secondary")+'" onclick="setMode(\'home\')">🏠 França / casa</button></div>';
 h+='<div class="tabs">';
 Object.keys(p).forEach(function(x){h+='<button class="tab '+(x===d?"on ":"")+(p[x].optional?"optional":"")+'" onclick="day(\''+x+'\')">'+x+'</button>'});
 h+='</div>';
 h+='<div class="card"><div class="row between"><div><h2>'+esc(ex.n)+'</h2><div class="muted">'+(S.mode==="gym"?"Fase academia • até 15/01/2027":"Fase França • 16/01 a 15/02/2027")+'</div></div><span class="badge">'+ct[0]+'/'+ct[1]+' séries</span></div>';
 if(S.mode==="gym")h+='<p class="tip"><b>Semana '+w+' de 9.</b> '+NOTES[w-1]+'</p>';
 else h+='<p class="tip">Treino sem equipamentos. Use variações que permitam boa técnica e esforço muscular. A meta é manter o estímulo durante a viagem, não reproduzir exatamente as cargas da academia.</p>';
 h+='<div class="row between"><b>Tempo: <span id="live">00:00</span></b><span class="muted">'+S.workouts.length+' treinos no histórico</span></div><div class="progress"><span style="width:'+(ct[1]?ct[0]/ct[1]*100:0)+'%"></span></div></div>';
 ex.e.forEach(function(e,i){
  let name=e[0],sets=targetSets(e),reps=e[2],rs=e[3],rir=e[4],vars=e[5],pr=previous(d,name),pv="Sem registro anterior";
  if(pr)pv=Object.values(pr.sets||{}).filter(function(x){return x.kg||x.reps}).map(function(x){return(S.mode==="home"?"":(x.kg||"—")+" kg × ")+(x.reps||"—")}).join(" / ")||pv;
  let b=best(d,name);
  h+='<div class="card exercise"><div class="row between"><div><h3>'+(i+1)+'. '+esc(name)+'</h3><div class="meta">'+sets+' × '+reps+' • descanso '+rs+' • RIR '+rir+'</div></div><a class="link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+" execução correta")+'">▶ Vídeo</a></div>';
  h+='<div class="prev"><b>Último registro:</b> '+esc(pv)+(b?'<br><span class="muted">Melhor carga registrada: '+esc(b)+'</span>':"")+'</div>';
  if(vars.length){h+='<select onchange="setVariant('+i+',this.value)">';vars.forEach(function(v){h+='<option '+(v===variant(i)?"selected":"")+'>'+esc(v)+'</option>'});h+='</select>'}
  if(S.mode==="home"){
   h+='<div class="setgrid home"><label>SÉRIE</label><label>REPS / TEMPO</label><label>OK</label>';
   for(let q=1;q<=sets;q++){let x=c.sets[i+"-"+q]||{};h+='<div class="setnum">'+q+'</div><input inputmode="numeric" value="'+esc(x.reps||"")+'" placeholder="reps/seg" onchange="setSet('+i+','+q+',\'reps\',this.value)"><button class="okset '+(x.done?"done":"")+'" onclick="done('+i+','+q+')">'+(x.done?"✓":"OK")+'</button>'}
  }else{
   h+='<div class="setgrid"><label>SÉRIE</label><label>KG</label><label>REPS</label><label>OK</label>';
   for(let q=1;q<=sets;q++){let x=c.sets[i+"-"+q]||{},r=pr&&pr.sets?pr.sets[q]:null;h+='<div class="setnum">'+q+'</div><input inputmode="decimal" value="'+esc(x.kg||"")+'" placeholder="'+esc(r&&r.kg?r.kg:"kg")+'" onchange="setSet('+i+','+q+',\'kg\',this.value)"><input inputmode="numeric" value="'+esc(x.reps||"")+'" placeholder="'+esc(r&&r.reps?r.reps:"reps")+'" onchange="setSet('+i+','+q+',\'reps\',this.value)"><button class="okset '+(x.done?"done":"")+'" onclick="done('+i+','+q+')">'+(x.done?"✓":"OK")+'</button>'}
  }
  h+='</div></div>';
 });
 h+='<div class="card"><button class="btn green" style="width:100%" onclick="finish()">✓ FINALIZAR TREINO '+d+'</button><p class="muted">Salva a sessão no histórico e avança para o próximo treino principal.</p></div>';
 document.getElementById("main").innerHTML=h;live();
}
function live(){let x=document.getElementById("live"),c=current();if(x)x.textContent=fmt(c.started?(Date.now()-c.started)/1000:0)}
function progress(){
 let w=week(),secs=S.workouts.reduce(function(a,x){return a+(x.seconds||0)},0),gymCount=S.workouts.filter(function(x){return x.mode!=="home"}).length,homeCount=S.workouts.filter(function(x){return x.mode==="home"}).length,h="";
 h+='<div class="card"><h2>📈 Evolução</h2><div class="statgrid"><div class="stat"><b>'+S.workouts.length+'</b><span>sessões</span></div><div class="stat"><b>'+fmt(secs)+'</b><span>tempo total</span></div><div class="stat"><b>'+w+'/9</b><span>semana</span></div></div><p class="muted">Academia: '+gymCount+' sessões • Casa/França: '+homeCount+' sessões</p><p class="tip">'+NOTES[w-1]+'</p></div>';
 h+='<div class="card"><h2>Ciclo atual</h2><div class="row">';
 for(let i=1;i<=9;i++)h+='<span class="badge '+(i===w?"ok":"")+'">S'+i+'</span>';
 h+='</div><p class="muted">Início: 16/11/2026 • Fase academia até 15/01/2027. A semana é calculada pela data de início.</p></div>';
 h+='<div class="card"><h2>Últimas sessões</h2>';let a=S.workouts.slice().reverse().slice(0,12);
 if(!a.length)h+='<p class="muted">Ainda não há treinos concluídos.</p>';
 a.forEach(function(x){let n=x.exercises.reduce(function(z,e){return z+Object.keys(e.sets||{}).length},0);h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — '+esc(x.day)+'<br><span class="muted">Semana '+(x.week||"—")+' • '+fmt(x.seconds||0)+'</span></span><b>'+n+' séries</b></div>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
function history(){
 let y=cal.getFullYear(),m=cal.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),map={};
 S.workouts.forEach(function(x){map[x.date]||(map[x.date]=[]);map[x.date].push(x.day)});
 let h='<div class="card"><div class="row between"><button class="btn secondary" onclick="calMove(-1)">‹</button><h2>'+new Date(y,m,1).toLocaleString("pt-BR",{month:"long",year:"numeric"})+'</h2><button class="btn secondary" onclick="calMove(1)">›</button></div><div class="calendar">';
 ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(function(x){h+='<div class="dow">'+x+'</div>'});
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"),a=map[k]||[];h+='<div class="calday '+(a.length?"trained ":"")+(k===today()?"today":"")+'" '+(a.length?'onclick="showDate(\''+k+'\')"':"")+'><b>'+d+'</b>'+(a.length?'<div>'+a.join(" · ")+'</div>':"")+'</div>'}
 h+='</div></div><div class="card"><h2>Histórico recente</h2>';let a=S.workouts.slice().reverse().slice(0,30);
 if(!a.length)h+='<p class="muted">Nenhum treino concluído.</p>';
 a.forEach(function(x){h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — '+esc(x.day)+'<br><span class="muted">Semana '+(x.week||"—")+' • '+fmt(x.seconds||0)+'</span></span><button class="btn secondary" onclick="showDate(\''+x.date+'\')">Ver</button></div>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
function calMove(n){cal.setMonth(cal.getMonth()+n);history()}
function showDate(date){
 let a=S.workouts.filter(function(w){return w.date===date}),h='<div class="card"><button class="btn secondary" onclick="go(\'history\')">← Voltar</button><h2 style="margin-top:12px">'+new Date(date+"T12:00:00").toLocaleDateString("pt-BR")+'</h2>';
 a.forEach(function(w){h+='<p><b>Treino '+esc(w.day)+'</b><br><span class="muted">Semana '+(w.week||"—")+' • '+fmt(w.seconds||0)+'</span></p><table style="width:100%;font-size:11px"><tr><th>Exercício</th><th>Variação</th><th>Desempenho</th></tr>';w.exercises.forEach(function(e){let z=Object.values(e.sets||{}).filter(function(s){return s.kg||s.reps}).map(function(s){return(s.kg?s.kg+" kg × ":"")+(s.reps||"—")}).join(" / ");h+='<tr><td>'+esc(e.name)+'</td><td>'+esc(e.variant||"—")+'</td><td>'+esc(z||"—")+'</td></tr>'});h+='</table>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
function planView(){
 let h='<div class="card"><h2>🗓️ Rotina semanal</h2><div class="schedule"><div><b>Segunda</b><br>Treino A + natação 17h–18h</div><div><b>Terça</b><br>Treino B + Pilates 7h–8h</div><div><b>Quarta</b><br>Natação 17h–18h + recuperação</div><div><b>Quinta</b><br>Treino C + Pilates 7h–8h</div><div><b>Sexta</b><br>Treino D</div><div><b>Sábado</b><br>Treino E opcional + caminhada</div><div><b>Domingo</b><br>Descanso</div><div><b>Caminhadas</b><br>2–3 vezes/semana, plano</div></div><p class="tip">A musculação segue a sequência A → B → C → D. O treino E é opcional e não substitui os quatro principais. Distribua as sessões ao redor da natação e do Pilates, evitando acumular fadiga.</p></div>';
 h+='<div class="card"><h2>Fase 1 — Academia</h2><b>16/11/2026 a 15/01/2027</b><p class="muted">Quatro treinos principais (A–D) e um treino E opcional de especialização.</p><p>Equipamentos considerados: leg press, cadeira extensora, mesa flexora, flexora em pé, hip thrust, supinos, puxadas, remadas, peck deck, polias e halteres.</p><p class="tip">Correções incorporadas: sem agachamento búlgaro; sem cadeira flexora; posteriores trabalhados com mesa flexora e flexora em pé; crucifixo feito na máquina peck deck.</p></div>';
 h+='<div class="card"><h2>Fase 2 — França / casa</h2><b>16/01/2027 a 15/02/2027</b><p class="muted">Três sessões de corpo inteiro por semana, sem levar equipamentos.</p><p>Use as abas H1, H2 e H3 na opção “França / casa”. As remadas e puxadas são isométricas com auto-resistência. A capacidade de gerar estímulo para costas sem equipamento é limitada; a meta é manter atividade e minimizar perdas.</p></div>';
 h+='<div class="card"><h2>Atividade aeróbica e coluna</h2><ul><li>Natação 2 vezes por semana.</li><li>Pilates 2 vezes por semana.</li><li>Caminhadas de 25–30 min, 2–3 vezes por semana, em terreno plano, se permanecerem sem dor.</li><li>Sem corrida, esteira ou saltos.</li></ul><p class="muted">Interrompa qualquer movimento que provoque dor lombar ou irradiação para as pernas e siga as orientações do fisioterapeuta.</p></div>';
 document.getElementById("main").innerHTML=h;
}
function settings(){
 let start=S.programStart||"2026-11-16",manual=S.weekOverride||"",h='<div class="card"><button class="btn secondary" onclick="go(\'train\')">← Voltar</button><h2 style="margin-top:12px">⚙️ Configurações</h2><p class="muted">Início do ciclo de 9 semanas.</p><input id="startDate" type="date" value="'+start+'" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><select id="manualWeek" style="margin-top:8px"><option value="">Semana automática</option>';
 for(let i=1;i<=9;i++)h+='<option value="'+i+'" '+(String(i)===String(manual)?"selected":"")+'>Semana '+i+'</option>';
 h+='</select><button class="btn" style="margin-top:8px" onclick="saveSettings()">Salvar</button></div><div class="card"><h2>💾 Backup</h2><p class="muted">Exporte seus dados antes de trocar de aparelho ou limpar o navegador. O backup inclui histórico, cargas, repetições e variações.</p><button class="btn" onclick="exportData()">Exportar backup</button> <label class="btn secondary" style="display:inline-block;margin-left:6px">Importar<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div><div class="card"><h2>Sobre a versão 3.0</h2><p class="muted">A versão mantém a chave de armazenamento da versão 2.1 para preservar seu histórico já salvo neste navegador. O backup enviado nesta conversa também pode ser importado caso precise recuperar seus registros.</p></div>';
 document.getElementById("main").innerHTML=h;
}
function saveSettings(){S.programStart=document.getElementById("startDate").value||"2026-11-16";let x=document.getElementById("manualWeek").value;S.weekOverride=x?+x:null;save();toast("Configurações salvas");setTimeout(function(){go("train")},300)}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="treino-hipertrofia-backup.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=function(){try{let x=JSON.parse(r.result);if(!x.workouts)throw Error();S=x;if(!S.variants)S.variants={};S.mode="gym";S.day="A";S.current=null;S.version=3;S.programStart="2026-11-16";S.weekOverride=null;save();toast("Backup importado");setTimeout(function(){go("train")},300)}catch(e){alert("Backup inválido.")}};r.readAsText(f)}
function render(){document.getElementById("navTrain").classList.toggle("on",S.view==="train");document.getElementById("navProgress").classList.toggle("on",S.view==="progress");document.getElementById("navHistory").classList.toggle("on",S.view==="history");document.getElementById("navPlan").classList.toggle("on",S.view==="plan");if(S.view==="train")train();else if(S.view==="progress")progress();else if(S.view==="history")history();else planView()}
setInterval(function(){if(S.view==="train")live()},1000);
save();render();
</script>
</body>
</html>
