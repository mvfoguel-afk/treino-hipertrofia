<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Treino Hipertrofia 2.1</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--blue:#2563eb;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:72px}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:15px 16px;box-shadow:0 2px 10px #0002}
.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:800}.sub{font-size:11px;opacity:.65}
main{max-width:780px;margin:auto;padding:10px 13px 25px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 9px}.tab{border:0;background:#e5e7eb;color:#374151;border-radius:12px;padding:10px 15px;font-weight:800;min-width:47px}.tab.on{background:var(--ink);color:#fff}.tab.f{position:relative}.tab.f:after{content:"opcional";position:absolute;font-size:7px;top:-5px;right:-2px;background:var(--warn);color:#fff;border-radius:5px;padding:2px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 1px 2px #00000008}.card h2{font-size:17px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--ink);color:#fff;font-weight:750}.btn.secondary{background:#e5e7eb;color:#111827}.btn.blue{background:var(--blue)}.btn.green{background:var(--ok)}.btn:disabled{opacity:.45}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--ink)}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#eef2ff;font-size:11px;font-weight:750}.badge.ok{background:#dcfce7;color:#166534}
.tip{border-left:4px solid var(--ink);padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.45}
.exercise h3{margin:0;font-size:16px}.meta{font-size:11px;color:var(--muted);margin:4px 0 10px}.prev{background:#f8fafc;border-radius:11px;padding:9px;margin-bottom:10px;font-size:12px;border:1px solid #eef2f7}
.setgrid{display:grid;grid-template-columns:35px 1fr 1fr 50px;gap:6px;align-items:center}.setgrid label{font-size:10px;color:var(--muted);font-weight:700}.setgrid input{width:100%;padding:9px;border:1px solid #d9dee7;border-radius:9px;background:#fff}.setnum{font-weight:800;text-align:center}.okset{background:#e5e7eb;border:0;border-radius:9px;padding:9px 5px;font-weight:800}.okset.done{background:var(--ok);color:#fff}
select{padding:9px;border:1px solid #d9dee7;border-radius:9px;background:#fff;width:100%}.link{color:var(--blue);text-decoration:none;font-size:12px;font-weight:750}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#fff;border-top:1px solid var(--line);padding:7px}.navinner{width:100%;max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.navbtn{border:0;background:transparent;border-radius:11px;padding:8px;color:#6b7280;font-size:11px;font-weight:750}.navbtn.on{background:#eef2ff;color:#111827}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:center;justify-content:center}.modal.on{display:flex}.sheet{width:92%;max-width:420px;background:#fff;border-radius:24px;padding:20px;text-align:center}.circle{width:180px;height:180px;border-radius:50%;margin:15px auto;background:conic-gradient(var(--ink) var(--deg),#e5e7eb 0);display:grid;place-items:center;position:relative}.circle:after{content:"";position:absolute;width:148px;height:148px;border-radius:50%;background:#fff}.timertext{position:relative;z-index:2;font-size:31px;font-weight:850}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px}.day{min-height:49px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px}.day.trained{background:var(--ink);color:#fff}.day.today{outline:2px solid var(--blue)}.session{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:50;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:420px){.setgrid{grid-template-columns:30px 1fr 1fr 47px}.statgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div><div class="title">Treino Hipertrofia</div><div class="sub">Versão 2.1 • correção de inicialização</div></div><button class="btn secondary" onclick="settings()">⚙️</button></div></header>
<main id="main"></main>
<nav class="navbar"><div class="navinner">
<button id="navTrain" class="navbtn on" onclick="go('train')">🏋️<br>Treino</button>
<button id="navProgress" class="navbtn" onclick="go('progress')">📈<br>Evolução</button>
<button id="navHistory" class="navbtn" onclick="go('history')">📅<br>Histórico</button>
</div></nav>
<div id="timerModal" class="modal"><div class="sheet"><button class="btn secondary" onclick="skipTimer()">Fechar</button><h2>DESCANSO</h2><div id="circle" class="circle" style="--deg:360deg"><div id="timerText" class="timertext">02:00</div></div><div id="timerLabel" class="muted"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn secondary" onclick="extendTimer(30)">+30 s</button><button class="btn secondary" onclick="extendTimer(-30)">−30 s</button><button class="btn" onclick="skipTimer()">Pular</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const P={
A:{n:"Peito + Tríceps",e:[
["Supino inclinado",3,"6–10","2–3 min","2",["Articulado","Halteres","Barra"]],
["Supino reto",3,"8–12","2–3 min","1–2",["Articulado","Halteres","Barra"]],
["Crucifixo na polia",3,"10–15","75–90 s","1",["Polia alta","Polia baixa"]],
["Chest press",2,"8–12","2 min","1",["Máquina"]],
["Tríceps na polia",3,"8–12","75–90 s","1",["Barra","Corda"]],
["Tríceps francês",3,"10–15","75–90 s","1–2",["Halter","Polia"]]]},
B:{n:"Costas + Bíceps",e:[
["Puxada alta",3,"6–10","2–3 min","2",["Pronada","Neutra"]],
["Remada baixa",3,"8–12","2 min","1–2",["Neutra","Pronada"]],
["Remada unilateral apoiada",3,"8–12","90–120 s","1–2",["Halter"]],
["Puxada alta fechada",2,"10–15","90 s","1",["Neutra","Supinada"]],
["Face pull",3,"12–20","60–90 s","1–2",["Corda"]],
["Rosca direta",3,"6–10","90–120 s","1–2",["Barra","Polia"]],
["Rosca inclinada",2,"10–15","75–90 s","1",["Halter"]]]},
C:{n:"Pernas A — Quadríceps",e:[
["Leg press",4,"6–10","2–3 min","2",["45°","Horizontal"]],
["Cadeira extensora",3,"10–15","75–90 s","1",["Máquina"]],
["Agachamento búlgaro",3,"8–12","90–120 s","2",["Halteres"]],
["Mesa flexora",3,"8–12","90 s","1–2",["Máquina"]],
["Cadeira flexora",2,"12–15","75–90 s","1",["Máquina"]],
["Panturrilha",4,"10–15","60–90 s","1",["Sentado","Leg press"]]]},
D:{n:"Ombros + Braços",e:[
["Desenvolvimento sentado",3,"6–10","2 min","2",["Halteres","Máquina"]],
["Elevação lateral",4,"10–20","60–75 s","1",["Halteres","Polia"]],
["Crucifixo inverso",3,"12–20","60–75 s","1–2",["Halteres","Máquina"]],
["Rosca Scott / polia",3,"8–12","90 s","1",["Scott","Polia"]],
["Tríceps francês unilateral",3,"10–15","75–90 s","1",["Polia"]],
["Rosca martelo",3,"10–15","75–90 s","1",["Halteres","Corda"]],
["Tríceps corda",3,"10–15","75–90 s","1",["Corda"]]]},
E:{n:"Pernas B + Peito/Costas",e:[
["Leg press",3,"10–15","2 min","1–2",["45°","Horizontal"]],
["Cadeira flexora",3,"8–12","90 s","1",["Máquina"]],
["Hip thrust",3,"8–12","2 min","2",["Máquina","Barra"]],
["Cadeira extensora",2,"12–15","75 s","1",["Máquina"]],
["Supino inclinado",3,"8–12","2 min","1–2",["Articulado","Halteres","Barra"]],
["Remada baixa",3,"8–12","2 min","1–2",["Neutra","Pronada"]],
["Elevação lateral",2,"15–20","60 s","1",["Halteres","Polia"]]]},
F:{n:"Opcional — Sábado",e:[
["Supino articulado",3,"8–12","2 min","1–2",["Articulado","Máquina"]],
["Puxada alta",3,"8–12","2 min","1–2",["Pronada","Neutra"]],
["Remada apoiada",3,"8–12","2 min","1–2",["Máquina","Halteres"]],
["Elevação lateral",3,"12–20","60 s","1",["Halteres","Polia"]],
["Rosca direta",2,"8–12","90 s","1",["Barra","Polia"]],
["Tríceps corda",2,"10–15","75 s","1",["Corda"]],
["Panturrilha",3,"10–15","60 s","1",["Sentado","Leg press"]]]}
};
const NOTES=[
"Semana 1 — RIR 2–3. Registre tudo e priorize técnica e amplitude.",
"Semana 2 — Tente aumentar repetições mantendo RIR 2.",
"Semana 3 — RIR 1–2 nos principais, sem perder técnica.",
"Semana 4 — Topo da faixa em todas as séries? Aumente a carga.",
"Semana 5 — Repita a estratégia e tente superar o último registro.",
"Semana 6 — Compostos em RIR ~1; isoladores podem chegar a RIR 0–1 na última série.",
"Semana 7 — Busque PRs de repetições/carga, evitando falha nos compostos.",
"Semana 8 — DELOAD: reduza 30–50% das séries e use RIR 3–4."
];
const KEY="TREINO_HIPERTROFIA_21";
let S=JSON.parse(localStorage.getItem(KEY)||"null");
if(!S){
  S={version:2,day:"A",view:"train",programStart:null,weekOverride:null,workouts:[],current:null,variants:{}};
}
let timerId=null,end=0,total=90;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]})}
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function today(){return new Date().toISOString().slice(0,10)}
function week(){if(S.weekOverride)return S.weekOverride;if(!S.programStart)return 1;let d=Math.floor((Date.now()-new Date(S.programStart+"T12:00:00").getTime())/86400000);return Math.max(1,Math.min(8,Math.floor(d/7)+1))}
function restSec(x){let a=x.match(/(\d+)\s*min/),b=x.match(/(\d+)\s*s/);return(a?+a[1]*60:0)+(b?+b[1]:0)||90}
function go(v){S.view=v;save();render()}
function day(d){S.day=d;S.view="train";save();render()}
function current(){if(!S.current||S.current.day!==S.day||S.current.date!==today()){S.current={date:today(),day:S.day,started:null,sets:{}};save()}return S.current}
function variant(i){return S.variants[S.day+"-"+i]||P[S.day].e[i][5][0]}
function setVariant(i,v){S.variants[S.day+"-"+i]=v;save();render()}
function setSet(i,q,f,v){let c=current(),k=i+"-"+q;c.sets[k]||(c.sets[k]={});c.sets[k][f]=v;save()}
function counts(){let c=current(),n=0,t=0;P[S.day].e.forEach(function(e,i){for(let q=1;q<=e[1];q++){t++;if(c.sets[i+"-"+q]&&c.sets[i+"-"+q].done)n++}});return[n,t]}
function previous(dayKey,i){let a=S.workouts.filter(function(w){return w.day===dayKey&&w.exercises&&w.exercises[i]});return a.length?a[a.length-1].exercises[i]:null}
function best(dayKey,i){let v=[];S.workouts.filter(function(w){return w.day===dayKey&&w.exercises&&w.exercises[i]}).forEach(function(w){Object.values(w.exercises[i].sets||{}).forEach(function(s){let kg=parseFloat(String(s.kg||"").replace(",",".")),rp=parseInt(s.reps);if(!isNaN(kg)&&!isNaN(rp))v.push({kg:kg,rp:rp})})});if(!v.length)return"";v.sort(function(a,b){return b.kg-a.kg||b.rp-a.rp});return v[0].kg+" kg × "+v[0].rp}
function done(i,q){let c=current();if(!c.started)c.started=Date.now();let k=i+"-"+q;c.sets[k]||(c.sets[k]={});c.sets[k].done=true;save();render();timerStart(restSec(P[S.day].e[i][3]),P[S.day].e[i][0]+" • próxima série")}
function finish(){
 let c=current(),ct=counts();if(!c.started||ct[0]===0){alert("Faça pelo menos uma série antes de finalizar.");return}
 let ex=P[S.day].e.map(function(e,i){let sets={};for(let q=1;q<=e[1];q++){let x=c.sets[i+"-"+q];if(x&&(x.kg||x.reps||x.done))sets[q]={kg:x.kg||"",reps:x.reps||"",done:!!x.done}}return{name:e[0],variant:variant(i),sets:sets}});
 S.workouts.push({date:c.date,day:S.day,week:week(),seconds:Math.floor((Date.now()-c.started)/1000),exercises:ex});
 let old=S.day;S.current=null;S.day=old==="F"?"A":String.fromCharCode(old.charCodeAt()+1);S.view="train";save();render();toast("Treino "+old+" concluído! Próximo: "+S.day)
}
function timerStart(sec,label){clearInterval(timerId);total=sec;end=Date.now()+sec*1000;document.getElementById("timerModal").classList.add("on");document.getElementById("timerLabel").textContent=label;tick();timerId=setInterval(tick,200)}
function tick(){let r=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("circle").style.setProperty("--deg",(r/total*360)+"deg");document.getElementById("timerText").textContent=fmt(r);if(!r){clearInterval(timerId);document.getElementById("timerText").textContent="VAMOS!";beep()}}
function extendTimer(s){end+=s*1000;if(end<Date.now())end=Date.now()+1}
function skipTimer(){clearInterval(timerId);document.getElementById("timerModal").classList.remove("on")}
function beep(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.7)}catch(e){if(navigator.vibrate)navigator.vibrate([300,120,300])}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function train(){
 let d=S.day,p=P[d],c=current(),ct=counts(),w=week(),h="";
 h+='<div class="tabs">';
 Object.keys(P).forEach(function(x){h+='<button class="tab '+(x===d?"on ":"")+(x==="F"?"f":"")+'" onclick="day(\''+x+'\')">'+x+'</button>'});
 h+='</div>';
 h+='<div class="card"><div class="row between"><div><h2>Treino '+d+' — '+esc(p.n)+'</h2><div class="muted">Semana '+w+' de 8</div></div><span class="badge">'+ct[0]+'/'+ct[1]+' séries</span></div>';
 h+='<p class="tip">'+NOTES[w-1]+'</p><div class="row between"><b>Tempo: <span id="live">00:00</span></b><span class="muted">'+S.workouts.length+' treinos concluídos</span></div>';
 h+='<div class="progress"><span style="width:'+(ct[1]?ct[0]/ct[1]*100:0)+'%"></span></div></div>';
 p.e.forEach(function(e,i){
   let name=e[0],sets=e[1],reps=e[2],rs=e[3],rir=e[4],vars=e[5],pr=previous(d,i),pv="Sem registro anterior";
   if(pr)pv=Object.values(pr.sets||{}).filter(function(x){return x.kg||x.reps}).map(function(x){return(x.kg||"—")+" kg × "+(x.reps||"—")}).join(" / ")||pv;
   let b=best(d,i);
   h+='<div class="card exercise"><div class="row between"><div><h3>'+i+1+'. '+esc(name)+'</h3><div class="meta">'+sets+' × '+reps+' • descanso '+rs+' • RIR '+rir+'</div></div>';
   h+='<a class="link" target="_blank" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+" execução correta "+variant(i))+'">▶ Vídeo</a></div>';
   h+='<div class="prev"><b>Último treino:</b> '+esc(pv)+(b?'<br><span class="muted">Melhor registro: '+esc(b)+'</span>':"")+'</div>';
   h+='<select onchange="setVariant('+i+',this.value)">';
   vars.forEach(function(v){h+='<option '+(v===variant(i)?"selected":"")+'>'+esc(v)+'</option>'});
   h+='</select><div class="setgrid"><label>SÉRIE</label><label>KG</label><label>REPS</label><label>OK</label>';
   for(let q=1;q<=sets;q++){
     let x=c.sets[i+"-"+q]||{},r=pr&&pr.sets?pr.sets[q]:null;
     h+='<div class="setnum">'+q+'</div>';
     h+='<input inputmode="decimal" value="'+esc(x.kg||"")+'" placeholder="'+esc(r&&r.kg?r.kg:"kg")+'" onchange="setSet('+i+','+q+',\'kg\',this.value)">';
     h+='<input inputmode="numeric" value="'+esc(x.reps||"")+'" placeholder="'+esc(r&&r.reps?r.reps:"reps")+'" onchange="setSet('+i+','+q+',\'reps\',this.value)">';
     h+='<button class="okset '+(x.done?"done":"")+'" onclick="done('+i+','+q+')">'+(x.done?"✓":"OK")+'</button>';
   }
   h+='</div></div>';
 });
 h+='<div class="card"><button class="btn green" style="width:100%" onclick="finish()">✓ FINALIZAR TREINO '+d+'</button><p class="muted">Salva o treino e seleciona automaticamente o próximo.</p></div>';
 document.getElementById("main").innerHTML=h;live();
}
function live(){let x=document.getElementById("live"),c=current();if(x)x.textContent=fmt(c.started?(Date.now()-c.started)/1000:0)}
function progress(){
 let w=week(),secs=S.workouts.reduce(function(a,x){return a+x.seconds},0),h="";
 h+='<div class="card"><h2>📈 Evolução</h2><div class="statgrid"><div class="stat"><b>'+S.workouts.length+'</b><span>treinos</span></div><div class="stat"><b>'+fmt(secs)+'</b><span>tempo total</span></div><div class="stat"><b>'+w+'/8</b><span>semana</span></div></div><p class="tip">'+NOTES[w-1]+'</p></div>';
 h+='<div class="card"><h2>Bloco de 8 semanas</h2><div class="row">';
 for(let i=1;i<=8;i++)h+='<span class="badge '+(i===w?"ok":"")+'">S'+i+'</span>';
 h+='</div><p class="muted">A semana é calculada pela data de início configurada em ⚙️.</p></div>';
 h+='<div class="card"><h2>Últimos treinos</h2>';
 let a=S.workouts.slice().reverse().slice(0,12);
 if(!a.length)h+='<p class="muted">Ainda não há treinos concluídos.</p>';
 a.forEach(function(x){let n=x.exercises.reduce(function(z,e){return z+Object.keys(e.sets||{}).length},0);h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — Treino '+x.day+'<br><span class="muted">Semana '+x.week+' • '+fmt(x.seconds)+'</span></span><b>'+n+' séries</b></div>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
let cal=new Date();
function history(){
 let y=cal.getFullYear(),m=cal.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),map={};
 S.workouts.forEach(function(x){map[x.date]||(map[x.date]=[]);map[x.date].push(x.day)});
 let h='<div class="card"><div class="row between"><button class="btn secondary" onclick="calMove(-1)">‹</button><h2>'+new Date(y,m,1).toLocaleString("pt-BR",{month:"long",year:"numeric"})+'</h2><button class="btn secondary" onclick="calMove(1)">›</button></div><div class="calendar">';
 ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(function(x){h+='<div class="dow">'+x+'</div>'});
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let d=1;d<=days;d++){let k=new Date(y,m,d).toISOString().slice(0,10),a=map[k]||[];h+='<div class="day '+(a.length?"trained ":"")+(k===today()?"today":"")+'" '+(a.length?'onclick="showDate(\''+k+'\')"':"")+'><b>'+d+'</b>'+(a.length?'<div>'+a.join(" · ")+'</div>':"")+'</div>'}
 h+='</div></div><div class="card"><h2>Histórico recente</h2>';
 let a=S.workouts.slice().reverse().slice(0,20);
 if(!a.length)h+='<p class="muted">Nenhum treino concluído.</p>';
 a.forEach(function(x){h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — Treino '+x.day+'<br><span class="muted">Semana '+x.week+' • '+fmt(x.seconds)+'</span></span><button class="btn secondary" onclick="showDate(\''+x.date+'\')">Ver</button></div>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
function calMove(n){cal.setMonth(cal.getMonth()+n);history()}
function showDate(date){
 let a=S.workouts.filter(function(w){return w.date===date}),h='<div class="card"><button class="btn secondary" onclick="go(\'history\')">← Voltar</button><h2 style="margin-top:12px">'+new Date(date+"T12:00:00").toLocaleDateString("pt-BR")+'</h2>';
 a.forEach(function(w){h+='<p><b>Treino '+w.day+' — '+esc(P[w.day].n)+'</b><br><span class="muted">Semana '+w.week+' • '+fmt(w.seconds)+'</span></p><table style="width:100%;font-size:11px"><tr><th>Exercício</th><th>Variação</th><th>Desempenho</th></tr>';w.exercises.forEach(function(e){let z=Object.values(e.sets||{}).filter(function(s){return s.kg||s.reps}).map(function(s){return(s.kg||"—")+" kg × "+(s.reps||"—")}).join(" / ");h+='<tr><td>'+esc(e.name)+'</td><td>'+esc(e.variant)+'</td><td>'+esc(z||"—")+'</td></tr>'});h+='</table>'});
 h+='</div>';document.getElementById("main").innerHTML=h;
}
function settings(){
 let start=S.programStart||"",manual=S.weekOverride||"",h='<div class="card"><button class="btn secondary" onclick="go(\'train\')">← Voltar</button><h2 style="margin-top:12px">⚙️ Configurações</h2><p class="muted">Defina o início do bloco de 8 semanas.</p><input id="startDate" type="date" value="'+start+'" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><select id="manualWeek" style="margin-top:8px"><option value="">Semana automática</option>';
 for(let i=1;i<=8;i++)h+='<option value="'+i+'" '+(String(i)===String(manual)?"selected":"")+'>Semana '+i+'</option>';
 h+='</select><button class="btn" style="margin-top:8px" onclick="saveSettings()">Salvar</button></div><div class="card"><h2>💾 Backup</h2><p class="muted">Exporte seus dados antes de trocar de aparelho ou limpar o navegador.</p><button class="btn" onclick="exportData()">Exportar backup</button><label class="btn secondary" style="display:inline-block;margin-left:6px">Importar<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div>';
 document.getElementById("main").innerHTML=h;
}
function saveSettings(){S.programStart=document.getElementById("startDate").value||null;let x=document.getElementById("manualWeek").value;S.weekOverride=x?+x:null;save();toast("Configurações salvas");setTimeout(function(){go("train")},300)}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="treino-hipertrofia-backup.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=function(){try{let x=JSON.parse(r.result);if(!x.workouts)throw Error();S=x;save();toast("Backup importado");setTimeout(function(){go("train")},300)}catch(e){alert("Backup inválido.")}};r.readAsText(f)}
function render(){document.getElementById("navTrain").classList.toggle("on",S.view==="train");document.getElementById("navProgress").classList.toggle("on",S.view==="progress");document.getElementById("navHistory").classList.toggle("on",S.view==="history");if(S.view==="train")train();else if(S.view==="progress")progress();else history()}
setInterval(function(){if(S.view==="train")live()},1000);
render();
</script>
</body>
</html>
