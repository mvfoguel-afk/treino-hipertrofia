function mergeWorkouts(incoming){let map=new Map();(S.workouts||[]).forEach(w=>map.set((w.date||"")+"|"+(w.mode||"gym")+"|"+w.day,w));(incoming||[]).forEach(w=>{let k=(w.date||"")+"|"+(w.mode||"gym")+"|"+w.day;if(!map.has(k))map.set(k,w)});S.workouts=Array.from(map.values()).sort((a,b)=>(a.date||"").localeCompare(b.date||""))}
mergeWorkouts(EMBEDDED_BACKUP.workouts||[]);
let timerId=null,end=0,total=90,alarmPlayed=false,audioCtx=null,cal=new Date();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Não foi possível salvar. Exporte um backup para proteger seus dados.")}}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dateKey(new Date())}
function dayDiff(a,b){let x=Date.parse(a+"T12:00:00Z"),y=Date.parse(b+"T12:00:00Z");return Math.floor((y-x)/86400000)}
function week(){if(S.weekOverride)return Math.max(1,Math.min(9,+S.weekOverride));let d=dayDiff(S.programStart||"2026-11-16",today());return Math.max(1,Math.min(9,Math.floor(d/7)+1))}
function restSec(x){let matches=[...x.matchAll(/(\d+)\s*(min|s)/g)];if(!matches.length)return 90;let vals=matches.map(m=>+m[1]*(m[2]==="min"?60:1));return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}
function plan(){return S.mode==="home"?HOME:GYM}
function go(v){S.view=v;save();render()}
function setMode(m){S.mode=m;S.day=m==="home"?"H1":"A";save();S.view="train";render()}
function day(d){S.day=d;S.view="train";save();render()}
function current(){let k=sessionKey(S.mode,S.day,today());if(!S.sessions[k])S.sessions[k]={date:today(),day:S.day,mode:S.mode,started:null,sets:{}};return S.sessions[k]}
function variant(i){let p=plan();return S.variants[S.mode+"-"+S.day+"-"+i]||(p[S.day].e[i][5][0]||"Peso corporal")}
function setVariant(i,v){S.variants[S.mode+"-"+S.day+"-"+i]=v;save();render()}
function setSet(i,q,f,v){let c=current(),k=i+"-"+q;c.sets[k]||(c.sets[k]={});c.sets[k][f]=v;save()}
function targetSets(e){if(S.mode==="gym"&&week()===5)return Math.max(1,Math.ceil(e[1]*0.65));return e[1]}
function counts(){let c=current(),n=0,t=0;plan()[S.day].e.forEach((e,i)=>{for(let q=1;q<=targetSets(e);q++){t++;if(c.sets[i+"-"+q]&&c.sets[i+"-"+q].done)n++}});return[n,t]}
function aliases(name){let a={};a["Supino inclinado articulado"]=["Supino inclinado"];a["Puxada alta pronada"]=["Puxada alta"];a["Puxada alta neutra"]=["Puxada alta fechada","Puxada alta"];a["Remada apoiada"]=["Remada unilateral apoiada"];a["Rosca Scott"]=["Rosca Scott / polia"];return [name].concat(a[name]||[])}
function previous(exerciseName){let names=aliases(exerciseName),all=[];S.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(names.includes(e.name))all.push({w,e})}));all.sort((a,b)=>(b.w.date||"").localeCompare(a.w.date||""));return all[0]||null}
function best(exerciseName){let names=aliases(exerciseName),v=[];S.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(names.includes(e.name))Object.values(e.sets||{}).forEach(s=>{let kg=parseFloat(String(s.kg||"").replace(",",".")),rp=parseInt(s.reps);if(!isNaN(kg)&&!isNaN(rp))v.push({kg,rp})})}));if(!v.length)return"";v.sort((a,b)=>b.kg-a.kg||b.rp-a.rp);return v[0].kg+" kg × "+v[0].rp}
function unlockAudio(){try{let C=window.AudioContext||window.webkitAudioContext;if(C){audioCtx=audioCtx||new C();if(audioCtx.state==="suspended")audioCtx.resume()}}catch(e){}}
function requestNotice(){if("Notification"in window&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}}
function done(i,q){unlockAudio();requestNotice();let c=current(),k=i+"-"+q;c.started=c.started||Date.now();c.sets[k]||(c.sets[k]={});c.sets[k].done=true;save();render();timerStart(restSec(plan()[S.day].e[i][3]),plan()[S.day].e[i][0]+" • próxima série")}
function finish(){let c=current(),ct=counts(),p=plan();if(!ct[0]){alert("Marque pelo menos uma série antes de finalizar.");return}let missing=ct[1]-ct[0];if(missing&&!confirm("Você marcou "+ct[0]+" de "+ct[1]+" séries. Finalizar mesmo assim?"))return;let ex=p[S.day].e.map((e,i)=>{let sets={};for(let q=1;q<=targetSets(e);q++){let x=c.sets[i+"-"+q];if(x&&(x.kg||x.reps||x.done))sets[q]={kg:x.kg||"",reps:x.reps||"",done:!!x.done}}return{name:e[0],variant:variant(i),sets}});S.workouts.push({date:c.date,day:S.day,mode:S.mode,week:week(),seconds:Math.floor((Date.now()-(c.started||Date.now()))/1000),exercises:ex});delete S.sessions[sessionKey(S.mode,S.day,today())];if(timerId)skipTimer();let old=S.day;if(S.mode==="home")S.day=old==="H1"?"H2":old==="H2"?"H3":"H1";else S.day=old==="E"?"A":old==="A"?"B":old==="B"?"C":old==="C"?"D":"A";save();render();toast("Treino "+old+" salvo. Próximo: "+S.day)}
function timerStart(sec,label){clearInterval(timerId);total=Math.max(1,sec);end=Date.now()+total*1000;alarmPlayed=false;S.timerLabel=label;S.timer={end,label,total};save();document.getElementById("timerModal").classList.add("on");document.getElementById("timerLabel").textContent=label;document.getElementById("timerStatus").textContent="Mantenha o app aberto para garantir o alerta no iPhone.";tick();timerId=setInterval(tick,250)}
function tick(){let r=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("circle").style.setProperty("--deg",(r/total*360)+"deg");document.getElementById("timerText").textContent=fmt(r);if(!r&&!alarmPlayed){alarmPlayed=true;clearInterval(timerId);S.timer=null;save();document.getElementById("timerText").textContent="VAMOS!";alarm();document.getElementById("timerStatus").textContent="Descanso concluído";}}
function alarm(){unlockAudio();try{if(audioCtx){let now=audioCtx.currentTime;[0,.35,.7].forEach(t=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(.25,now+t+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t+.22);o.start(now+t);o.stop(now+t+.24)})}}catch(e){}try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,500])}catch(e){}try{if("Notification"in window&&Notification.permission==="granted")new Notification("Descanso concluído",{body:"Hora de continuar: "+(S.timerLabel||"próxima série")})}catch(e){}toast("⏰ Descanso concluído!")}
function extendTimer(s){end=Math.max(Date.now()+1000,end+s*1000);total=Math.max(1,Math.ceil((end-Date.now())/1000));if(!timerId)timerId=setInterval(tick,250);alarmPlayed=false;S.timer={end,label:document.getElementById("timerLabel").textContent,total};save();tick()}
function closeTimer(){clearInterval(timerId);timerId=null;document.getElementById("timerModal").classList.remove("on")}
function skipTimer(){S.timer=null;save();closeTimer()}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function train(){let p=plan(),d=S.day,ex=p[d],c=current(),ct=counts(),w=week(),h="";h+='<div class="phasebar"><button class="btn '+(S.mode==="gym"?"":"secondary")+'" onclick="setMode(\'gym\')">🏋️ Academia</button><button class="btn '+(S.mode==="home"?"":"secondary")+'" onclick="setMode(\'home\')">🏠 França / casa</button></div><div class="tabs">';Object.keys(p).forEach(x=>h+='<button class="tab '+(x===d?"on ":"")+(p[x].optional?"optional":"")+'" onclick="day(\''+x+'\')">'+x+'</button>');h+='</div>';
h+='<div class="card"><div class="row between"><div><h2>'+esc(ex.n)+'</h2><div class="muted">'+(S.mode==="gym"?"Fase academia • início 16/11/2026":"Fase França • treino sem equipamentos")+'</div></div><span class="badge">'+ct[0]+'/'+ct[1]+' séries</span></div>';if(S.mode==="gym")h+='<p class="tip"><b>Semana '+w+' de 9.</b> '+NOTES[w-1]+'</p>';else h+='<p class="tip">Treino sem equipamentos. Use variações que permitam boa técnica e esforço muscular. A meta é manter o estímulo durante a viagem, sem provocar dor lombar.</p>';h+='<div class="row between"><b>Tempo: <span id="live">00:00</span></b><span class="muted">'+S.workouts.length+' treinos no histórico</span></div><div class="progress"><span style="width:'+(ct[1]?ct[0]/ct[1]*100:0)+'%"></span></div></div>';
ex.e.forEach((e,i)=>{let name=e[0],sets=targetSets(e),pr=previous(name),pv="Sem registro anterior";if(pr){let vals=Object.values(pr.e.sets||{}).filter(x=>x.kg||x.reps).map(x=>(x.kg?x.kg+" kg × ":"")+(x.reps||"—"));pv=pr.w.date+" • "+vals.join(" / ");if(!vals.length)pv=pr.w.date+" • sem carga/reps registradas"}let b=best(name);h+='<div class="card exercise"><div class="row between"><div><h3>'+(i+1)+'. '+esc(name)+'</h3><div class="meta">'+sets+' × '+e[2]+' • descanso '+e[3]+' • RIR '+e[4]+'</div></div><a class="link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+" execução correta")+'">▶ Vídeo</a></div><div class="prev"><b>Último registro:</b> '+esc(pv)+(b?'<br><span class="muted">Melhor carga histórica (exercício igual ou equivalente): '+esc(b)+'</span>':"")+'</div>';if(e[5].length){h+='<select onchange="setVariant('+i+',this.value)">';e[5].forEach(v=>h+='<option '+(v===variant(i)?"selected":"")+'>'+esc(v)+'</option>');h+='</select>'}if(S.mode==="home"){h+='<div class="setgrid home"><label>SÉRIE</label><label>REPS / TEMPO</label><label>OK</label>';for(let q=1;q<=sets;q++){let x=c.sets[i+"-"+q]||{};h+='<div class="setnum">'+q+'</div><input inputmode="numeric" value="'+esc(x.reps||"")+'" placeholder="reps/seg" onchange="setSet('+i+','+q+',\'reps\',this.value)"><button class="okset '+(x.done?"done":"")+'" onclick="done('+i+','+q+')">'+(x.done?"✓":"OK")+'</button>'}}else{h+='<div class="setgrid"><label>SÉRIE</label><label>KG</label><label>REPS</label><label>OK</label>';for(let q=1;q<=sets;q++){let x=c.sets[i+"-"+q]||{},r=pr&&pr.e.sets?pr.e.sets[q]:null;h+='<div class="setnum">'+q+'</div><input inputmode="decimal" value="'+esc(x.kg||"")+'" placeholder="'+esc(r&&r.kg?r.kg:"kg")+'" onchange="setSet('+i+','+q+',\'kg\',this.value)"><input inputmode="numeric" value="'+esc(x.reps||"")+'" placeholder="'+esc(r&&r.reps?r.reps:"reps")+'" onchange="setSet('+i+','+q+',\'reps\',this.value)"><button class="okset '+(x.done?"done":"")+'" onclick="done('+i+','+q+')">'+(x.done?"✓":"OK")+'</button>'}}h+='</div></div>'});h+='<div class="card"><button class="btn green" style="width:100%" onclick="finish()">✓ FINALIZAR TREINO '+d+'</button><p class="muted">Você pode finalizar com séries incompletas após confirmar. O registro parcial será preservado.</p></div>';document.getElementById("main").innerHTML=h;live()}
function live(){let x=document.getElementById("live"),c=current();if(x)x.textContent=fmt(c.started?(Date.now()-c.started)/1000:0)}
function progress(){let w=week(),secs=S.workouts.reduce((a,x)=>a+(x.seconds||0),0),gymCount=S.workouts.filter(x=>x.mode!=="home").length,homeCount=S.workouts.filter(x=>x.mode==="home").length,h='<div class="card"><h2>📈 Evolução</h2><div class="statgrid"><div class="stat"><b>'+S.workouts.length+'</b><span>sessões</span></div><div class="stat"><b>'+fmt(secs)+'</b><span>tempo total</span></div><div class="stat"><b>'+w+'/9</b><span>semana</span></div></div><p class="muted">Academia: '+gymCount+' sessões • Casa/França: '+homeCount+' sessões</p><p class="tip">'+NOTES[w-1]+'</p></div><div class="card"><h2>Ciclo atual</h2><div class="row">';for(let i=1;i<=9;i++)h+='<span class="badge '+(i===w?"ok":"")+'">S'+i+'</span>';h+='</div><p class="muted">Início: '+esc(S.programStart)+' • cálculo por data civil, sem depender do horário em que o app foi aberto.</p></div><div class="card"><h2>Últimas sessões</h2>';S.workouts.slice().reverse().slice(0,12).forEach(x=>{let n=(x.exercises||[]).reduce((z,e)=>z+Object.keys(e.sets||{}).length,0);h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — '+esc(x.day)+'<br><span class="muted">Semana '+(x.week||"—")+' • '+fmt(x.seconds||0)+'</span></span><b>'+n+' séries</b></div>'});if(!S.workouts.length)h+='<p class="muted">Ainda não há treinos concluídos.</p>';h+='</div>';document.getElementById("main").innerHTML=h}
function history(){let y=cal.getFullYear(),m=cal.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),map={};S.workouts.forEach(x=>(map[x.date]||(map[x.date]=[])).push(x.day));let h='<div class="card"><div class="row between"><button class="btn secondary" onclick="calMove(-1)">‹</button><h2>'+new Date(y,m,1).toLocaleString("pt-BR",{month:"long",year:"numeric"})+'</h2><button class="btn secondary" onclick="calMove(1)">›</button></div><div class="calendar">';["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(x=>h+='<div class="dow">'+x+'</div>');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let k=dateKey(new Date(y,m,d)),a=map[k]||[];h+='<div class="calday '+(a.length?"trained ":"")+(k===today()?"today":"")+'" '+(a.length?'onclick="showDate(\''+k+'\')"':"")+'><b>'+d+'</b>'+(a.length?'<div>'+a.join(" · ")+'</div>':"")+'</div>'}h+='</div></div><div class="card"><h2>Histórico recente</h2>';S.workouts.slice().reverse().slice(0,35).forEach(x=>h+='<div class="session"><span><b>'+new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")+'</b> — '+esc(x.day)+'<br><span class="muted">Semana '+(x.week||"—")+' • '+fmt(x.seconds||0)+'</span></span><button class="btn secondary" onclick="showDate(\''+x.date+'\')">Ver</button></div>');if(!S.workouts.length)h+='<p class="muted">Nenhum treino concluído.</p>';h+='</div>';document.getElementById("main").innerHTML=h}
function calMove(n){cal.setMonth(cal.getMonth()+n);history()}
function showDate(date){let a=S.workouts.filter(w=>w.date===date),h='<div class="card"><button class="btn secondary" onclick="go(\'history\')">← Voltar</button><h2 style="margin-top:12px">'+new Date(date+"T12:00:00").toLocaleDateString("pt-BR")+'</h2>';a.forEach(w=>{h+='<p><b>Treino '+esc(w.day)+'</b><br><span class="muted">Semana '+(w.week||"—")+' • '+fmt(w.seconds||0)+'</span></p><div style="overflow:auto"><table style="width:100%;font-size:11px;text-align:left"><tr><th>Exercício</th><th>Variação</th><th>Desempenho</th></tr>';w.exercises.forEach(e=>{let z=Object.values(e.sets||{}).filter(s=>s.kg||s.reps).map(s=>(s.kg?s.kg+" kg × ":"")+(s.reps||"—")).join(" / ");h+='<tr><td>'+esc(e.name)+'</td><td>'+esc(e.variant||"—")+'</td><td>'+esc(z||"—")+'</td></tr>'});h+='</table></div>'});h+='</div>';document.getElementById("main").innerHTML=h}
function planView(){let h='<div class="card"><h2>🗓️ Organização do ciclo</h2><p>Sequência principal: <b>A → B → C → D</b>. O treino E é opcional e não substitui os quatro principais.</p><p class="tip">A distribuição semanal pode ser ajustada em função da natação, do Pilates, da recuperação e da rotina. Evite concentrar sessões pesadas de pernas em dias consecutivos. A sequência do aplicativo só avança quando você finaliza uma sessão.</p></div><div class="card"><h2>Fase 1 — Academia</h2><b>16/11/2026 a 15/01/2027</b><p class="muted">Quatro treinos principais (A–D) e um treino E opcional.</p><p>Equipamentos considerados: leg press, cadeira extensora, mesa flexora, flexora em pé, hip thrust, supinos articulados, puxadas, remadas, peck deck, polias e halteres.</p><p class="tip">Correções incorporadas: sem agachamento búlgaro; sem cadeira flexora; posteriores trabalhados com mesa flexora e flexora em pé; crucifixo feito na máquina peck deck.</p></div><div class="card"><h2>Fase 2 — França / casa</h2><b>16/01/2027 a 15/02/2027</b><p class="muted">Três sessões de corpo inteiro (H1, H2 e H3), sem equipamentos.</p><p>As remadas e puxadas são isométricas com auto-resistência. Sem equipamento, o estímulo para costas é limitado; a meta é manter atividade e minimizar perdas.</p></div><div class="card"><h2>Atividade aeróbica e coluna</h2><ul><li>Natação e Pilates conforme sua agenda.</li><li>Caminhadas leves em terreno plano, se permanecerem sem dor.</li><li>Sem corrida, saltos ou exercícios de impacto.</li></ul><p class="muted">Interrompa movimentos que provoquem dor lombar ou irradiação para as pernas e siga as orientações do fisioterapeuta.</p></div>';document.getElementById("main").innerHTML=h}
function settings(){let h='<div class="card"><button class="btn secondary" onclick="go(\'train\')">← Voltar</button><h2 style="margin-top:12px">⚙️ Configurações</h2><p class="muted">Início do ciclo de 9 semanas.</p><input id="startDate" type="date" value="'+esc(S.programStart||"2026-11-16")+'" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:9px"><select id="manualWeek" style="margin-top:8px"><option value="">Semana automática</option>';for(let i=1;i<=9;i++)h+='<option value="'+i+'" '+(String(i)===String(S.weekOverride)?"selected":"")+'>Semana '+i+'</option>';h+='</select><button class="btn" style="margin-top:8px" onclick="saveSettings()">Salvar</button></div><div class="card"><h2>🔔 Timer e notificações</h2><p class="muted">O app pode tocar som e vibrar quando está aberto. No iPhone, permita notificações se o navegador oferecer essa opção. Para maior confiabilidade, adicione o app à Tela de Início e mantenha a tela ativa durante o descanso.</p><button class="btn secondary" onclick="askNotifications()">Ativar permissão de notificações</button><p class="small muted">Importante: um site não consegue garantir um alarme local se o iOS suspender o Safari/PWA em segundo plano. Isso exigiria infraestrutura de notificações push; não vou prometer um alerta que o navegador não consegue garantir.</p></div><div class="card"><h2>💾 Backup</h2><p class="muted">Os 36 treinos do backup antigo foram incorporados automaticamente, sem apagar os dados já salvos neste aparelho. Exporte regularmente para guardar uma cópia.</p><button class="btn" onclick="exportData()">Exportar backup</button> <label class="btn secondary" style="display:inline-block;margin-left:6px">Importar e mesclar<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div><div class="card"><h2>Versão 3.1</h2><p class="muted">Séries completas nas semanas regulares; semana de recuperação com redução moderada; semanas calculadas por data civil; histórico pesquisado entre todos os dias de treino; importação mesclada e sessões em andamento preservadas ao trocar de aba.</p></div>';document.getElementById("main").innerHTML=h}
function saveSettings(){S.programStart=document.getElementById("startDate").value||"2026-11-16";let x=document.getElementById("manualWeek").value;S.weekOverride=x?+x:null;save();toast("Configurações salvas");go("train")}
function askNotifications(){if(!("Notification"in window)){alert("Este navegador não oferece notificações web.");return}Notification.requestPermission().then(x=>alert(x==="granted"?"Permissão concedida.":"Permissão não concedida."))}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="treino-hipertrofia-backup-v31.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.workouts))throw Error("Formato inválido");mergeWorkouts(x.workouts);if(x.variants)Object.assign(S.variants,x.variants);save();toast("Backup mesclado sem apagar os registros existentes");go("history")}catch(e){alert("Backup inválido ou incompatível.")}};r.readAsText(f)}
function render(){document.getElementById("navTrain").classList.toggle("on",S.view==="train");document.getElementById("navProgress").classList.toggle("on",S.view==="progress");document.getElementById("navHistory").classList.toggle("on",S.view==="history");document.getElementById("navPlan").classList.toggle("on",S.view==="plan");if(S.view==="train")train();else if(S.view==="progress")progress();else if(S.view==="history")history();else planView()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.timer){end=S.timer.end;total=S.timer.total||Math.max(1,Math.ceil((end-Date.now())/1000));if(end<=Date.now()){document.getElementById("timerModal").classList.add("on");tick()}else{document.getElementById("timerModal").classList.add("on");if(!timerId)timerId=setInterval(tick,250)}}});
setInterval(()=>{if(S.view==="train")live()},1000);
save();render();
if(S.timer){end=S.timer.end;total=S.timer.total||Math.max(1,Math.ceil((end-Date.now())/1000));document.getElementById("timerModal").classList.add("on");document.getElementById("timerLabel").textContent=S.timer.label||"Descanso";if(end<=Date.now())tick();else timerId=setInterval(tick,250)}
</script>
</body></html>
